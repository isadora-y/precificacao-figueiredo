<style>
:root{
  /* verde da logo do Figueiredo */
  --logo:#4B5D47; --marca:#4B5D47; --marca-escura:#2E3A2B; --marca-clara:#E4E9E1; --marca-tinta:#3A4836;
  --fundo:#F2F4F0; --superficie:#FFFFFF; --linha:#D6DCD3; --linha-forte:#B5BFB1;
  --texto:#1C221A; --texto-2:#566052; --texto-3:#838C7F;
  --ok:#2E7A4C; --ok-fundo:#E1F0E6; --alerta:#A86A12; --alerta-fundo:#FBEBCF; --erro:#B42318; --erro-fundo:#FBE3E0;
  --neutro-fundo:#ECEEE9; --foco:#6E8A68;
  --y-teal:#0D9299; --y-navy:#07252D;
  --raio:6px;
  --mono:'IBM Plex Mono', ui-monospace, monospace; --sans:'IBM Plex Sans', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--marca)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.lateral{background:var(--logo);color:#EEF2EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.marca img{width:56px;height:56px;display:block;flex:none}
.marca .palavra{font:600 18px/1.1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.marca .sub{font-size:12px;color:#D3DCCF;margin-top:3px}
nav.menu{display:flex;flex-direction:column;padding:12px 10px;gap:2px}
nav.menu a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:var(--raio);color:#E6ECE3;text-decoration:none;font-weight:500}
nav.menu a:hover{background:rgba(255,255,255,.08)}
nav.menu a.ativo{background:rgba(255,255,255,.18);color:#fff}
nav.menu .cont{font-size:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px}
.lateral .rodape{margin-top:auto;padding:16px 20px;font-size:12px;color:#C9D3C5;border-top:1px solid rgba(255,255,255,.12)}
.lateral .rodape b{color:#7FD3D6;font-weight:600}
.modo{margin:12px 12px 0;padding:10px 12px;border-radius:var(--raio);background:rgba(255,255,255,.1);font-size:12px;color:#DCE4D8}
.modo strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
main{min-width:0;padding:28px 32px 48px}
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:600 22px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--marca-escura)}
.cabeca p{margin:4px 0 0;color:var(--texto-2);max-width:70ch}
h2{font:600 15px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.03em;margin:28px 0 10px;color:var(--marca-escura)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--superficie);padding:14px 16px}
.kpi .v{font:600 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.kpi .r{font-size:13px;color:var(--texto-2);margin-top:4px}
.kpi.alerta .v{color:var(--alerta)}
.kpi.erro .v{color:var(--erro)}

/* barra de filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros input[type=search],.filtros select{height:36px;border:1px solid var(--linha-forte);border-radius:var(--raio);background:var(--superficie);padding:0 10px;min-width:0}
.filtros input[type=search]{width:260px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--linha-forte);background:var(--superficie);cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:#fff}
.btn{height:36px;padding:0 14px;border-radius:var(--raio);border:1px solid var(--linha-forte);background:var(--superficie);cursor:pointer;font-weight:500}
.btn.prim{background:var(--marca);border-color:var(--marca);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.espaco{flex:1}

/* tabelas */
.tabela-wrap{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:1;background:#F7F8F3;text-align:left;font-weight:600;font-size:12.5px;color:var(--texto-2);padding:9px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
th.num{text-align:right}
td{padding:8px 8px;border-bottom:1px solid #ECEEE4;vertical-align:middle}
tr.grupo td{background:var(--marca-clara);font:600 12.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--marca-tinta);padding:7px 10px}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover td{background:#FAFBF6}
td .sub{display:block;font-size:12px;color:var(--texto-3)}
td:first-child{min-width:180px}
.vazio{padding:28px;text-align:center;color:var(--texto-2)}

/* status e cmv */
.status{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.st-ok{background:var(--ok-fundo);color:var(--ok)}
.st-acima{background:var(--alerta-fundo);color:var(--alerta)}
.st-sem{background:var(--neutro-fundo);color:var(--texto-2)}
.cmv{display:flex;align-items:center;gap:8px;min-width:120px}
.cmv .trilho{position:relative;flex:1;height:8px;background:#ECEEE4;border-radius:4px}
.cmv .barra{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.cmv .barra.acima{background:var(--alerta)}
.cmv .alvo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--marca-escura)}
.cmv .pct{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmv .pct.acima{color:var(--alerta)}

/* inputs nas tabelas */
.in-num{width:96px;height:32px;border:1px solid var(--linha-forte);border-radius:5px;padding:0 8px;text-align:right;background:#FFFEF5;font-variant-numeric:tabular-nums}
.in-num:focus{background:#fff}
.zero{color:var(--erro);font-weight:600}
tr.mudou td{background:#FFF8E6}

/* fichas */
.fichas{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.lista{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);max-height:calc(100vh - 190px);overflow:auto}
.lista button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #ECEEE4;background:none;padding:9px 12px;cursor:pointer}
.lista button:hover{background:#FAFBF6}
.lista button.ativo{background:var(--marca-clara)}
.lista .tipo{font-size:11.5px;color:var(--texto-3)}
.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}
.painel h3{font:600 18px/1.25 var(--sans);margin:0}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 14px;color:var(--texto-2);font-size:13.5px}
.meta b{color:var(--texto);font-variant-numeric:tabular-nums}
.totais{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.totais > div{border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px}
.totais .v{font:600 18px var(--sans);font-variant-numeric:tabular-nums}
.totais .r{font-size:12.5px;color:var(--texto-2)}
.modo-preparo{white-space:pre-line;color:var(--texto-2);font-size:14px;max-width:75ch}
.usada{display:flex;flex-wrap:wrap;gap:6px}
.usada a{font-size:13px;background:var(--neutro-fundo);padding:3px 9px;border-radius:12px;text-decoration:none;color:var(--texto)}
.link{background:none;border:0;padding:0;color:var(--marca);cursor:pointer;text-decoration:underline;font:inherit}

/* gaveta */
.gaveta-fundo{position:fixed;inset:0;background:rgba(29,32,19,.35);display:none;z-index:20}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--fundo);z-index:21;transform:translateX(100%);transition:transform .2s ease;overflow:auto;padding:22px}
.gaveta.aberta{transform:none}
.gaveta-fundo.aberta{display:block}
.fechar{float:right}

/* simulador e parâmetros */
.grade2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600;color:var(--texto-2)}
.campo input,.campo select{height:38px;border:1px solid var(--linha-forte);border-radius:var(--raio);padding:0 10px;background:var(--superficie)}
.campo small{color:var(--texto-3);font-size:12.5px}
.nota{font-size:13px;color:var(--texto-2);max-width:75ch}
.sobe{color:var(--erro)} .desce{color:var(--ok)}

/* pendências */
.pend-grupo{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:12px}
.pend-grupo summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between}
.pend{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid #ECEEE4;align-items:start}
.pend.feita{opacity:.55}
.pend .onde{font-weight:600}
.pend .det{color:var(--texto-2);font-size:14px}
.pend .imp{font-size:12.5px;color:var(--alerta);white-space:nowrap}

/* aviso */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--marca-escura);color:#fff;padding:12px 16px;border-radius:var(--raio);max-width:min(560px,92vw);font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* login (modo Supabase) */
.tela-login{min-height:100vh;display:grid;place-items:center;padding:24px}
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:26px;width:min(420px,100%)}

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:sticky;height:auto;z-index:10}
  .marca{padding:10px 16px}
  .marca img{width:40px;height:40px}
  nav.menu{flex-direction:row;overflow-x:auto;padding:6px 8px 10px}
  nav.menu a{white-space:nowrap}
  nav.menu .cont{display:none}
  .lateral .rodape,.modo{display:none}
  main{padding:18px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fichas,.grade2{grid-template-columns:1fr}
  .lista{max-height:260px}
  .filtros input[type=search]{width:100%}
  .tabela-wrap{max-height:none}
  .totais{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){ .gaveta,.toast{transition:none} }

/* ---------- Gestão Figueiredo: complementos ---------- */
textarea{font:inherit;color:inherit}
.marca .palavra{font-size:16px}
.lateral .voltar{display:block;margin:10px 10px 0;padding:8px 12px;border-radius:var(--raio);color:#E6ECE3;text-decoration:none;font-size:13px;background:rgba(255,255,255,.08)}
.lateral .voltar:hover{background:rgba(255,255,255,.14)}
.lateral .quem{font-size:12.5px;color:#E6ECE3;margin-bottom:6px}
.lateral .quem b{color:#fff;font-weight:600}
.lateral .acoes-usuario{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lateral .acoes-usuario a,.lateral .acoes-usuario button{color:#E6ECE3;font-size:12.5px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.modulo-nome{font-size:12px;color:#D3DCCF;margin-top:3px}

/* início */
.inicio{min-height:100vh;display:flex;flex-direction:column}
.topo{background:var(--logo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.topo img{width:44px;height:44px}
.topo .t{font:600 18px/1.1 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.topo .s{font-size:12.5px;color:#D3DCCF}
.topo .dir{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13.5px;flex-wrap:wrap;justify-content:flex-end}
.topo .dir a,.topo .dir button{color:#fff;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:13.5px}
.inicio main{max-width:980px;width:100%;margin:0 auto;padding:40px 24px}
.inicio h1{margin-bottom:6px}
.modulos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}
.modulo{display:flex;flex-direction:column;gap:12px;background:var(--superficie);border:1px solid var(--linha);border-radius:10px;padding:24px;text-decoration:none;color:var(--texto);transition:border-color .15s, box-shadow .15s}
a.modulo:hover{border-color:var(--marca);box-shadow:0 0 0 3px var(--marca-clara)}
.modulo .ico{width:46px;height:46px;border-radius:10px;background:var(--marca-clara);display:grid;place-items:center;color:var(--marca)}
.modulo h2{margin:0;font-size:17px}
.modulo p{margin:0;color:var(--texto-2);font-size:14px}
.modulo ul{margin:0;padding-left:18px;color:var(--texto-2);font-size:13.5px}
.modulo .entrar{margin-top:auto;font-weight:600;color:var(--marca)}
.modulo.bloq{opacity:.55}
.modulo .resumo{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--texto-2)}
.modulo .resumo b{display:block;font-size:20px;color:var(--texto);font-variant-numeric:tabular-nums}

/* formulários em gaveta */
.form h3{font:600 19px/1.25 var(--sans);margin:4px 0 4px}
.form .sub{color:var(--texto-2);font-size:13.5px;margin:0 0 16px}
.form .linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.campo textarea{border:1px solid var(--linha-forte);border-radius:var(--raio);padding:8px 10px;background:var(--superficie);min-height:110px;resize:vertical}
.campo.check{flex-direction:row;align-items:center;gap:8px}
.campo.check input{height:auto;width:18px;height:18px}
.campo.check label{font-weight:500;color:var(--texto)}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn.perigo{color:var(--erro);border-color:#E7B7B1}
.btn.peq{height:30px;padding:0 10px;font-size:13px}
.aviso{background:var(--alerta-fundo);color:#6B4300;border-radius:var(--raio);padding:10px 12px;font-size:13.5px;margin:10px 0}
.aviso.erro{background:var(--erro-fundo);color:#7A1A12}
.aviso.ok{background:var(--ok-fundo);color:#1E5634}
.previa{background:var(--marca-clara);border-radius:var(--raio);padding:10px 12px;font-size:14px;margin:4px 0 12px}
.previa b{font-variant-numeric:tabular-nums}

/* tabela de ingredientes / adicionar */
.add-ing{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) 92px minmax(0,1.4fr) auto;gap:8px;align-items:end;margin-top:12px;padding:12px;background:#F7F8F3;border:1px dashed var(--linha-forte);border-radius:var(--raio)}
.add-ing .campo{margin:0}
.add-ing input,.add-ing select{height:36px;border:1px solid var(--linha-forte);border-radius:var(--raio);padding:0 8px;background:#fff;min-width:0;width:100%}
.x{border:0;background:none;color:var(--texto-3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--erro);background:var(--erro-fundo)}
.in-txt{height:32px;border:1px solid var(--linha-forte);border-radius:5px;padding:0 8px;background:#FFFEF5;min-width:0}
.in-sel{height:32px;border:1px solid var(--linha-forte);border-radius:5px;padding:0 6px;background:#FFFEF5}
.in-num.peq{width:72px}
.in-data{height:32px;border:1px solid var(--linha-forte);border-radius:5px;padding:0 6px;background:#FFFEF5}
.add-ing.add-troca{grid-template-columns:140px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto}
.fichas{grid-template-columns:320px minmax(0,1fr)}
.cab-ficha{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}

/* curva abc */
.classe{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;font-weight:700;font-size:12.5px}
.classe.A{background:var(--ok-fundo);color:var(--ok)}
.classe.B{background:var(--alerta-fundo);color:var(--alerta)}
.classe.C{background:var(--neutro-fundo);color:var(--texto-2)}
tfoot td{font-weight:600;background:#F7F8F3;position:sticky;bottom:0}

/* pessoas */
.st-erro{background:var(--erro-fundo);color:var(--erro)}
.mes-sel{display:flex;align-items:center;gap:8px}
.mes-sel input{height:36px;border:1px solid var(--linha-forte);border-radius:var(--raio);padding:0 8px;background:var(--superficie)}
.escala td.dia{text-align:center;padding:4px}
.escala th.dia{text-align:center}
.cel{width:100%;min-width:64px;height:32px;border-radius:5px;border:1px solid var(--linha);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--texto-3)}
.cel.folga{background:#DCEBF7;border-color:#A9C9E6;color:#1F4E79}
.cel.dobra{background:var(--alerta-fundo);border-color:#E9C98F;color:#7A4F01}
.cel:disabled{cursor:default}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--texto-2);margin:8px 0}
.legenda span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--linha)}
.legenda .l-folga::before{background:#DCEBF7;border-color:#A9C9E6}
.legenda .l-dobra::before{background:var(--alerta-fundo);border-color:#E9C98F}
.tabela-wrap.sem-max{max-height:none}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mini th,.mini td{padding:6px 8px}
.carregando{padding:60px;text-align:center;color:var(--texto-2)}

@media (max-width: 900px){
  .modulos,.grade3{grid-template-columns:1fr}
  .form .linha2,.form .linha3{grid-template-columns:1fr}
  .fichas,.grade2{grid-template-columns:minmax(0,1fr)}
  .add-ing,.add-ing.add-troca{grid-template-columns:1fr 1fr}
  .add-ing .campo:first-child,.add-ing .campo.obs{grid-column:1 / -1}
  .topo{padding:12px 16px}
  .inicio main{padding:24px 16px}
  .lateral .voltar{display:inline-block;margin:0 0 0 8px}
  .lateral .rodape{display:none}
}
.lateral .quem b{overflow-wrap:anywhere}
.topo .dir b{overflow-wrap:anywhere}
th .sub{display:block;font-weight:400}
.inicio > footer{margin:0 auto}

/* =====================================================================
   Gestão Figueiredo · núcleo
   Conexão com o Supabase (login por senha + dados), estado, rotas,
   tela de login, início com os módulos, usuários e senha.
   ===================================================================== */
const CFG = Object.assign({ supabaseUrl: '', supabaseAnonKey: '', empresaSlug: 'figueiredo' }, window.FIG_CONFIG || {});
const DOMINIO_LOGIN = 'gestaofigueiredo.app';

/* ---------------------------------------------------------- formatação */
const fBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fNum = (d) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = v => (v === null || v === undefined || isNaN(v)) ? '–' : fBRL.format(v);
const pct = v => (v === null || v === undefined || isNaN(v)) ? '–' : fNum(1).format(v * 100) + '%';
const qtdTxt = (v) => (v === null || v === undefined || v === '') ? '–' : new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 4 }).format(v);
const numTxt = (v, d = 2) => (v === null || v === undefined || v === '' || isNaN(v)) ? '' : new Intl.NumberFormat('pt-BR', { maximumFractionDigits: d }).format(v);
function amigavel(q, u) {
  if (q === null || q === undefined || q === '') return '';
  if (u === 'kg' && q < 1) return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(q * 1000) + ' g';
  if (u === 'L' && q < 1) return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(q * 1000) + ' ml';
  return qtdTxt(q) + ' ' + u;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lerNum = s => { if (s === null || s === undefined) return NaN; const t = String(s).trim().replace(/\s/g, '').replace(/^R\$/, ''); if (t === '') return NaN; return Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const slugify = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dataBR = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '–';
const mesBR = s => { if (!s) return '–'; const [y, m] = s.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+m - 1] + '/' + y; };
function toast(msg, ms = 4500) { const t = document.getElementById('toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
const normalizarLogin = l => { const t = String(l || '').trim().toLowerCase(); return t.includes('@') ? t : t + '@' + DOMINIO_LOGIN; };
const loginVisivel = e => String(e || '').endsWith('@' + DOMINIO_LOGIN) ? e.split('@')[0] : e;

/* ---------------------------------------------------------- mensagens de erro */
function traduzirErro(msg, code) {
  const m = String(msg || '');
  if (/Invalid login credentials/i.test(m)) return 'Usuário ou senha incorretos.';
  if (/row-level security|permission denied|42501/i.test(m) || code === '42501') return 'Seu perfil não tem permissão para fazer isso.';
  if (/duplicate key|23505/i.test(m) || code === '23505') return 'Já existe um cadastro com esse nome.';
  if (/foreign key|23503/i.test(m) || code === '23503') return 'Este item está sendo usado em outro lugar (por exemplo, em uma ficha técnica) e não pode ser excluído.';
  if (/at least 6 characters/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/different from the old password/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
  if (/JWT expired|invalid JWT|refresh token/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
  if (/Ciclo de receitas/i.test(m)) return 'Essa receita já usa esta ficha; uma não pode conter a outra.';
  return m;
}

/* ---------------------------------------------------------- conexão com o Supabase */
const API = {
  url: String(CFG.supabaseUrl || '').trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1$/, ''),
  key: String(CFG.supabaseAnonKey || '').trim(),
  CHAVE: 'gestao-figueiredo-sessao',
  sessao: null,
  _renovando: null,
  configurado() { return !!(this.url && this.key); },
  carregarSessao() { try { this.sessao = JSON.parse(localStorage.getItem(this.CHAVE) || 'null'); } catch (e) { this.sessao = null; } },
  guardar(s) {
    this.sessao = s;
    try { if (s) localStorage.setItem(this.CHAVE, JSON.stringify(s)); else localStorage.removeItem(this.CHAVE); } catch (e) { }
  },
  normalizarSessao(d) {
    const agora = Math.floor(Date.now() / 1000);
    return { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || (agora + (d.expires_in || 3600)), user: d.user || null };
  },
  async http(caminho, { method = 'GET', body, headers = {}, auth = true } = {}) {
    if (auth) await this.garantirToken();
    const h = Object.assign({ apikey: this.key, 'Content-Type': 'application/json' }, headers);
    if (auth && this.sessao) h.Authorization = 'Bearer ' + this.sessao.access_token;
    let r;
    try { r = await fetch(this.url + caminho, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) }); }
    catch (e) { throw new Error(traduzirErro(e.message)); }
    const txt = await r.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
    if (!r.ok) {
      const bruto = (data && (data.message || data.msg || data.error_description || data.error)) || ('Erro ' + r.status);
      const code = data && (data.code || data.error_code);
      const e = new Error(traduzirErro(bruto, code)); e.status = r.status; e.code = code; e.bruto = bruto;
      if (r.status === 401 && auth) { this.guardar(null); e.sessaoExpirada = true; }
      throw e;
    }
    return data;
  },
  async entrar(login, senha) {
    const d = await this.http('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: normalizarLogin(login), password: senha }, auth: false });
    this.guardar(this.normalizarSessao(d));
  },
  async garantirToken() {
    if (!this.sessao) { const e = new Error('Sua sessão expirou. Entre de novo.'); e.sessaoExpirada = true; throw e; }
    if (this.sessao.expires_at - 60 > Date.now() / 1000) return;
    if (!this._renovando) {
      this._renovando = (async () => {
        try {
          const d = await this.http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: this.sessao.refresh_token }, auth: false });
          this.guardar(this.normalizarSessao(d));
        } catch (e) { this.guardar(null); e.sessaoExpirada = true; throw e; }
        finally { this._renovando = null; }
      })();
    }
    await this._renovando;
  },
  async sair() { try { await this.http('/auth/v1/logout', { method: 'POST' }); } catch (e) { } this.guardar(null); },
  async trocarSenha(nova) { await this.http('/auth/v1/user', { method: 'PUT', body: { password: nova } }); },
  async usuarioAtual() { return this.http('/auth/v1/user'); },
  filtro(f = {}) {
    return Object.entries(f).map(([k, v]) => {
      if (Array.isArray(v)) return k + '=in.(' + v.map(x => encodeURIComponent('"' + x + '"')).join(',') + ')';
      if (v === null) return k + '=is.null';
      if (typeof v === 'string' && /^(gte|lte|gt|lt|neq)\./.test(v)) return k + '=' + v.replace(/^(\w+)\.(.*)$/, (m, op, val) => op + '.' + encodeURIComponent(val));
      return k + '=eq.' + encodeURIComponent(v);
    }).join('&');
  },
  async lista(tabela, { select = '*', filtro = {}, order = '' } = {}) {
    const out = [];
    for (let off = 0; ; off += 1000) {
      const q = ['select=' + select, this.filtro(filtro), order ? 'order=' + order : '', 'limit=1000', 'offset=' + off].filter(Boolean).join('&');
      const d = await this.http('/rest/v1/' + tabela + '?' + q);
      out.push(...d);
      if (d.length < 1000) return out;
    }
  },
  async inserir(tabela, linhas) { return this.http('/rest/v1/' + tabela, { method: 'POST', body: linhas, headers: { Prefer: 'return=representation' } }); },
  async upsert(tabela, linhas, conflito) {
    return this.http('/rest/v1/' + tabela + '?on_conflict=' + conflito, { method: 'POST', body: linhas, headers: { Prefer: 'resolution=merge-duplicates,return=representation' } });
  },
  async atualizar(tabela, filtro, dados) {
    const d = await this.http('/rest/v1/' + tabela + '?' + this.filtro(filtro), { method: 'PATCH', body: dados, headers: { Prefer: 'return=representation' } });
    if (Array.isArray(d) && d.length === 0) throw new Error('Seu perfil não tem permissão para alterar isso.');
    return d;
  },
  async remover(tabela, filtro) {
    const d = await this.http('/rest/v1/' + tabela + '?' + this.filtro(filtro), { method: 'DELETE', headers: { Prefer: 'return=representation' } });
    if (Array.isArray(d) && d.length === 0) throw new Error('Seu perfil não tem permissão para excluir isso.');
    return d;
  },
  async rpc(fn, args = {}) { return this.http('/rest/v1/rpc/' + fn, { method: 'POST', body: args }); },
};

/* ---------------------------------------------------------- estado e permissões */
const S = {
  user: null, membro: null, empresa: null, unidades: [],
  custosOk: false, pessoasOk: false,
};
const papel = () => S.membro ? S.membro.papel : null;
const pode = {
  admin: () => papel() === 'admin',
  custos: () => !!S.membro && (papel() === 'admin' || S.membro.acesso_custos !== false),
  pessoas: () => !!S.membro && (papel() === 'admin' || (S.membro.acesso_pessoas || 'nenhum') !== 'nenhum'),
  pessoasEdita: () => !!S.membro && (papel() === 'admin' || S.membro.acesso_pessoas === 'edicao'),
  insumos: () => ['admin', 'gestor', 'compras'].includes(papel()),
  fichas: () => ['admin', 'gestor', 'cozinha'].includes(papel()),
  cardapio: () => ['admin', 'gestor'].includes(papel()),
  parametros: () => ['admin', 'gestor'].includes(papel()),
};
const PAPEIS = {
  admin: ['Administrador', 'Tudo, inclusive cadastrar usuários'],
  gestor: ['Gestor', 'Edita preços, fichas, cardápio e parâmetros'],
  compras: ['Compras', 'Atualiza preços e cadastra insumos'],
  cozinha: ['Cozinha', 'Cria e edita fichas técnicas'],
  leitura: ['Só consulta', 'Vê tudo, não altera nada'],
};

/* ---------------------------------------------------------- rotas */
const MODULOS = {
  custos: { nome: 'Cardápio e Custos', telas: {} },
  pessoas: { nome: 'Gestão de Pessoas', telas: {} },
};
function rota() {
  const h = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (MODULOS[h[0]]) {
    const telas = MODULOS[h[0]].telas;
    const tela = telas[h[1]] ? h[1] : Object.keys(telas)[0];
    return { modulo: h[0], tela, arg: h.slice(2).join('/') };
  }

let gavetaAoFechar = null;
function abrirGaveta(html, aoAbrir) {
  const g = document.getElementById('gaveta');
  g.innerHTML = `<button class="btn fechar" id="gfechar" type="button">Fechar</button>` + html;

  document.getElementById('gfundo').classList.add('aberta');
  document.getElementById('gfechar').onclick = fecharGaveta;
  if (aoAbrir) aoAbrir(g);
  const primeiro = g.querySelector('input:not([type=hidden]):not([disabled]),select,textarea');
  (primeiro || document.getElementById('gfechar')).focus();
}
function fecharGaveta() {
  const g = document.getElementById('gaveta');
  g.classList.remove('aberta'); g.setAttribute('aria-hidden', 'true');
  document.getElementById('gfundo').classList.remove('aberta');
  if (gavetaAoFechar) { const f = gavetaAoFechar; gavetaAoFechar = null; f(); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharGaveta(); });
const val = (id) => { const el = document.getElementById(id); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
function campo(id, rotulo, { tipo = 'text', valor = '', ajuda = '', opcoes = null, attrs = '', lista = null, desab = false } = {}) {
  let input;
  if (opcoes) input = `<select id="${id}" ${attrs} ${desab ? 'disabled' : ''}>${opcoes.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(valor ?? '') ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
  else if (tipo === 'textarea') input = `<textarea id="${id}" ${attrs} ${desab ? 'disabled' : ''}>${esc(valor)}</textarea>`;
  else if (tipo === 'checkbox') return `<div class="campo check"><input type="checkbox" id="${id}" ${valor ? 'checked' : ''} ${attrs} ${desab ? 'disabled' : ''}><label for="${id}">${rotulo}</label></div>`;
  else input = `<input id="${id}" type="${tipo}" value="${esc(valor)}" ${lista ? `list="${id}-l"` : ''} ${attrs} ${desab ? 'disabled' : ''}>${lista ? `<datalist id="${id}-l">${lista.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
  return `<div class="campo"><label for="${id}">${rotulo}</label>${input}${ajuda ? `<small>${ajuda}</small>` : ''}</div>`;
}
async function executar(botao, acao) { // trava o botão enquanto salva e mostra erro
  const b = typeof botao === 'string' ? document.getElementById(botao) : botao;
  const txt = b ? b.textContent : '';
  if (b) { b.disabled = true; b.textContent = 'Salvando…'; }
  try { return await acao(); }
  catch (e) {
    if (e.sessaoExpirada) { telaLogin('Sua sessão expirou. Entre de novo.'); throw e; }
    toast(esc(e.message || e), 6500); throw e;
  }
  finally { if (b && b.isConnected) { b.disabled = false; b.textContent = txt; } }
}

/* =====================================================================
   Módulo Cardápio e Custos
   Números oficiais vêm das views do banco (v_receita_custos, v_cardapio).
   O motor local abaixo espelha essas views e é usado só para simulação
   e para a prévia ao vivo antes de gravar.

const C = { parametros: null, insumos: new Map(), receitas: new Map(), itens: [], cardapio: [], pendencias: [], vendas: [], oficial: null, original: null,
  filtros: { painel: { busca: '', cat: '', status: '' }, insumos: { busca: '', cat: '', so: '' }, fichas: { busca: '', tipo: 'prato' }, abc: { mes: hojeISO().slice(0, 7), por: 'faturamento' } } };

const TIPOS_FICHA = { prato: 'Prato', preparo: 'Preparo', base: 'Base', drink: 'Drink' };

function precoFinal(v, final) { if (!(v > 0)) return 0; const d = 1 - final; return Math.round((Math.ceil(v + d - 1e-9) - d) * 100) / 100; }
function precoLiquido(i) { return i.preco / i.qtd * i.fc; }
function calcular(st, sobre = {}) {
  const P = Object.assign({}, st.parametros, sobre.parametros || {});
  const precoIns = id => { const i = st.insumos.get(id); if (!i) return 0; const p = (sobre.precos && sobre.precos[id] !== undefined) ? sobre.precos[id] : i.preco; return p / i.qtd * i.fc; };
  const itensPor = new Map();
  for (const it of st.itens) { if (!itensPor.has(it.receita_id)) itensPor.set(it.receita_id, []); itensPor.get(it.receita_id).push(it); }
  const memo = new Map(), usoIns = new Map();
  function custo(rid, pilha = []) {
    if (memo.has(rid)) return memo.get(rid);
    if (pilha.includes(rid) || !st.receitas.has(rid)) return { total: 0, unit: 0, semPreco: 0, insumos: new Set() };
    const r = st.receitas.get(rid); let total = 0, semPreco = 0; const ins = new Set();
    for (const it of (itensPor.get(rid) || [])) {

/* ---------------------------------------------------------- Simulador */
const SIM = { insumo: '', preco: '', modo: 'alvo', pct: 5 };
function telaSimulador() {
  const ins = [...C.insumos.values()].filter(i => i.ativo).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  let res = '';
  const i = C.insumos.get(SIM.insumo); const novo = lerNum(SIM.preco);
  if (i && !isNaN(novo)) {
    const sim = calcular(C, { precos: { [i.id]: novo } });
    const linhas = C.cardapio.map(c => ({ c, a: C.oficial.cardapio.get(c.id), b: sim.cardapio.get(c.id) })).filter(x => x.a.custo_total !== null && Math.abs(x.b.custo_total - x.a.custo_total) > 0.004).sort((x, y) => (y.b.custo_total - y.a.custo_total) - (x.b.custo_total - x.a.custo_total));
    const viram = linhas.filter(x => x.a.status !== 'acima do alvo' && x.b.status === 'acima do alvo').length;
    res = linhas.length ? `<p class="nota">${linhas.length} itens mudam de custo${viram ? `; <b>${viram}</b> passam a ficar acima do CMV alvo` : ''}. Nada foi gravado.</p>
      <div class="tabela-wrap" style="max-height:420px"><table><thead><tr><th>Item</th><th class="num">Custo hoje</th><th class="num">Custo simulado</th><th class="num">CMV hoje</th><th class="num">CMV simulado</th></tr></thead><tbody>
      ${linhas.map(x => `<tr><td>${esc(x.c.nome)}<span class="sub">${esc(x.c.categoria)}</span></td><td class="num">${brl(x.a.custo_total)}</td><td class="num ${x.b.custo_total > x.a.custo_total ? 'sobe' : 'desce'}">${brl(x.b.custo_total)}</td><td class="num">${pct(x.a.cmv)}</td><td class="num">${pct(x.b.cmv)} ${x.b.status === 'acima do alvo' ? '⚠︎' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<p class="nota">Nenhum item do cardápio usa ${esc(i.nome)}.</p>`;
  }
  const precosVenda = {}; const reaj = [];
  for (const c of C.cardapio) {
    const o = C.oficial.cardapio.get(c.id); if (!(o.preco > 0) || o.custo_total === null) continue;
    let novoP = o.preco;
    if (SIM.modo === 'alvo' && o.status === 'acima do alvo') novoP = o.preco_cmv_alvo;
    if (SIM.modo === 'pct') novoP = precoFinal(o.preco * (1 + (lerNum(SIM.pct) || 0) / 100), C.parametros.final_preco);
    if (Math.abs(novoP - o.preco) > 0.004) { precosVenda[c.id] = novoP; reaj.push({ c, o, novoP }); }
  }
  const simR = calcular(C, { precosVenda });
  const { inicio } = periodoMes(C.filtros.abc.mes);
  const vend = new Map(C.vendas.filter(v => v.inicio === inicio).map(v => [v.item, v.qtd]));
  const base = C.cardapio.filter(c => C.oficial.cardapio.get(c.id).preco > 0);
  const pesoT = base.reduce((s, c) => s + (vend.get(c.id) || 0), 0);
  const aumMedio = pesoT
    ? base.reduce((s, c) => s + (vend.get(c.id) || 0) * ((precosVenda[c.id] ?? C.oficial.cardapio.get(c.id).preco) / C.oficial.cardapio.get(c.id).preco - 1), 0) / pesoT
    : base.reduce((s, c) => s + ((precosVenda[c.id] ?? C.oficial.cardapio.get(c.id).preco) / C.oficial.cardapio.get(c.id).preco - 1), 0) / (base.length || 1);
  const acimaDepois = [...simR.cardapio.values()].filter(o => o.status === 'acima do alvo').length;
  return `<div class="cabeca"><div><h1>Simulador</h1><p>Veja o efeito de uma mudança antes de aplicar. Nada aqui altera os dados.</p></div></div>
  <div class="grade2">
    <section class="painel"><h3>E se um insumo mudar de preço?</h3><p class="nota">Escolha o insumo e digite o novo preço da unidade de compra.</p>
      <div class="campo"><label for="sins">Insumo</label><select id="sins"><option value="">Escolha…</option>${ins.map(x => `<option value="${esc(x.id)}" ${x.id === SIM.insumo ? 'selected' : ''}>${esc(x.nome)} (${brl(x.preco)} / ${esc(x.unidade_compra)})</option>`).join('')}</select></div>
      <div class="campo"><label for="spreco">Novo preço (R$)</label><input id="spreco" inputmode="decimal" value="${esc(SIM.preco)}" placeholder="${i ? fNum(2).format(i.preco) : '0,00'}"></div>
      ${res}</section>
    <section class="painel"><h3>Reajuste do cardápio</h3><p class="nota">${pesoT ? `Aumento médio ponderado pelas vendas de ${mesBR(inicio)} (Curva ABC).` : 'Sem vendas lançadas na Curva ABC para o mês, o aumento médio é a média simples dos itens.'}</p>
      <div class="filtros">${[['alvo', 'Levar ao CMV alvo os itens acima'], ['pct', 'Reajuste linear']].map(([v, t]) => `<button class="chip" data-sim="${v}" aria-pressed="${SIM.modo === v}">${t}</button>`).join('')}</div>
      ${SIM.modo === 'pct' ? `<div class="campo"><label for="spct">Reajuste (%)</label><input id="spct" inputmode="decimal" value="${esc(SIM.pct)}"><small>Preços arredondados para terminar em ,90.</small></div>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><div class="v">${reaj.length}</div><div class="r">itens com preço novo</div></div><div class="kpi"><div class="v">${pct(aumMedio)}</div><div class="r">aumento médio do cardápio</div></div><div class="kpi"><div class="v">${acimaDepois}</div><div class="r">acima do alvo depois</div></div></div>
      ${reaj.length ? `<div class="tabela-wrap" style="max-height:360px"><table><thead><tr><th>Item</th><th class="num">Preço hoje</th><th class="num">Preço novo</th><th class="num">Aumento</th><th class="num">CMV novo</th></tr></thead><tbody>${reaj.map(x => `<tr><td>${esc(x.c.nome)}<span class="sub">${esc(x.c.categoria)}</span></td><td class="num">${brl(x.o.preco)}</td><td class="num">${brl(x.novoP)}</td><td class="num">${pct(x.novoP / x.o.preco - 1)}</td><td class="num">${pct(simR.cardapio.get(x.c.id).cmv)}</td></tr>`).join('')}</tbody></table></div>
      ${pode.cardapio() ? `<div class="acoes"><button class="btn prim" id="baplicar">Aplicar estes ${reaj.length} preços no cardápio</button></div>` : ''}` : '<p class="nota">Nenhum item precisa de preço novo com essa regra.</p>'}
    </section></div>`;
}
function ligarSimulador() {
  const $ = id => document.getElementById(id);
  $('sins').onchange = e => { SIM.insumo = e.target.value; SIM.preco = ''; render(); };
  $('spreco').oninput = e => { SIM.preco = e.target.value; clearTimeout(ligarSimulador._t); ligarSimulador._t = setTimeout(render, 300); };
  document.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => { SIM.modo = b.dataset.sim; render(); });
  if ($('spct')) $('spct').oninput = e => { SIM.pct = e.target.value; clearTimeout(ligarSimulador._t); ligarSimulador._t = setTimeout(render, 300); };
  if ($('baplicar')) $('baplicar').onclick = async () => {
    const lista = [];
    for (const c of C.cardapio) {
      const o = C.oficial.cardapio.get(c.id); if (!(o.preco > 0) || o.custo_total === null) continue;
      let p = o.preco;
      if (SIM.modo === 'alvo' && o.status === 'acima do alvo') p = o.preco_cmv_alvo;
      if (SIM.modo === 'pct') p = precoFinal(o.preco * (1 + (lerNum(SIM.pct) || 0) / 100), C.parametros.final_preco);
      if (Math.abs(p - o.preco) > 0.004) lista.push([c, p]);
    }
    if (!confirm(`Gravar o preço novo de ${lista.length} itens no cardápio?`)) return;
    await executar('baplicar', async () => { for (const [c, p] of lista) await API.atualizar('cardapio_itens', { id: c.id }, { preco_venda: p }); });
    await gravarCustos(async () => { }, `${lista.length} preços atualizados no cardápio.`);
  };
}

/* =====================================================================
   Módulo Gestão de Pessoas
   Cadastro, férias, vale-transporte, comissão (10%), vales e escala.
   Salários e chaves PIX só chegam a quem tem acesso a este módulo
   (as regras de acesso ficam no banco).
   ===================================================================== */
const P = { colabs: [], par: {}, vt: new Map(), comMes: new Map(), faltas: new Map(), vales: [], escala: new Map(), trocas: [],
  mes: hojeISO().slice(0, 7), semana: null,
  filtros: { colab: { busca: '', unidade: '', setor: '', status: 'ativos' }, escala: { setor: '', unidade: '' }, ferias: { so: '' } } };
const SETORES_PADRAO = ['Salão', 'Cozinha', 'Produção', 'Bar', 'Administrativo'];
const NIVEIS_PADRAO = ['Aprendiz', 'Júnior', 'Pleno', 'Sênior', 'Líder', 'Gestor'];
const STATUS_COLAB = ['Ativo', 'Férias', 'Afastado', 'Desligado'];
const GRUPOS = ['Garçom', 'Retaguarda', 'Não participa'];
const DIAS_SEM = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

/* ---------------------------------------------------------- datas (sempre AAAA-MM-DD) */
const dUTC = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoUTC = d => d.toISOString().slice(0, 10);
function addMeses(s, n) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); const alvo = new Date(Date.UTC(y, m - 1 + n, 1)); const ult = new Date(Date.UTC(alvo.getUTCFullYear(), alvo.getUTCMonth() + 1, 0)).getUTCDate(); alvo.setUTCDate(Math.min(d, ult)); return isoUTC(alvo); }
function mesesEntre(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0); }
const diasEntre = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 86400000);
const addDias = (s, n) => { const d = dUTC(s); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); };
const segundaDe = s => { const d = dUTC(s); const w = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - w); return isoUTC(d); };
const mesISO = () => P.mes + '-01';
const fimMes = m => addDias(addMeses(m + '-01', 1), -1);
const tempoCasa = meses => meses === null ? '–' : meses < 12 ? `${meses} ${meses === 1 ? 'mês' : 'meses'}` : `${Math.floor(meses / 12)} a${meses % 12 ? ` ${meses % 12} m` : ''}`;

/* ---------------------------------------------------------- carga */
async function carregarPessoas() {
  const E = S.empresa.id, n = v => v === null || v === undefined ? null : Number(v);
  const [cols, par, vt, cm, fal, vales, esc, troc] = await Promise.all([
    API.lista('colaboradores', { filtro: { empresa_id: E }, order: 'nome.asc' }),
    API.lista('pessoas_parametros', { filtro: { empresa_id: E } }),
    API.lista('vt_lancamentos', { order: 'mes.asc' }),
    API.lista('comissao_meses', { filtro: { empresa_id: E } }),
    API.lista('comissao_faltas', { order: 'mes.asc' }),
    API.lista('vales', { filtro: { empresa_id: E }, order: 'data.asc,created_at.asc' }),
    API.lista('escala_dias', { order: 'data.asc' }),
    API.lista('escala_trocas', { filtro: { empresa_id: E }, order: 'data.asc,id.asc' }),
  ]);
  P.colabs = cols.map(c => Object.assign({}, c, { salario_base: n(c.salario_base), vt_dia: n(c.vt_dia) || 0 }));
  const ids = new Set(P.colabs.map(c => c.id));
  const p = par[0] || {};
  P.par = {}; for (const k of ['vale_limite_pct', 'vale_max_mes', 'vale_dia_solicitar', 'vale_dia_pagamento', 'ferias_max_setor_mes', 'ferias_alerta_dias', 'comissao_garcom', 'comissao_retaguarda', 'comissao_loja']) P.par[k] = n(p[k]);
  P.parExiste = !!par.length;
  P.vt = new Map(vt.filter(v => ids.has(v.colaborador_id)).map(v => [v.colaborador_id + '|' + v.mes.slice(0, 7), n(v.dias)]));
  P.comMes = new Map(cm.map(c => [c.mes.slice(0, 7), { total: n(c.total_10), g: n(c.parcela_garcom), r: n(c.parcela_retaguarda), l: n(c.parcela_loja) }]));
  P.faltas = new Map(fal.filter(f => ids.has(f.colaborador_id)).map(f => [f.colaborador_id + '|' + f.mes.slice(0, 7), n(f.faltas)]));
  P.vales = vales.map(v => Object.assign({}, v, { valor: n(v.valor) }));
  P.escala = new Map(esc.filter(e => ids.has(e.colaborador_id)).map(e => [e.colaborador_id + '|' + e.data, e.tipo]));
  P.trocas = troc;
  if (!P.semana) P.semana = segundaDe(hojeISO());
}
async function gravarPessoas(acao, msgOk) {
  try { await acao(); await carregarPessoas(); render(); if (msgOk) toast(msgOk); return true; }
  catch (e) {
    if (e.sessaoExpirada) { telaLogin('Sua sessão expirou. Entre de novo.'); return false; }
    toast('Não foi possível salvar: ' + esc(e.message || e), 7000);
    try { await carregarPessoas(); } catch (e2) { }
    render(); return false;
  }
}

/* ---------------------------------------------------------- regras */
const colab = id => P.colabs.find(c => c.id === id);
const naoDesligados = () => P.colabs.filter(c => c.status !== 'Desligado');
const setores = () => [...new Set(SETORES_PADRAO.concat(P.colabs.map(c => c.setor).filter(Boolean)))];
const unidadesP = () => [...new Set(S.unidades.concat(P.colabs.map(c => c.unidade).filter(Boolean)))];
function ferias(c) {
  const hoje = hojeISO();
  const meses = c.admissao ? Math.max(0, mesesEntre(c.admissao, hoje)) : null;
  const anos = meses === null ? 0 : Math.floor(meses / 12);
  const periodo = anos >= 1 ? addMeses(c.admissao, anos * 12) : null; // início do último período aquisitivo completo
  const limite = periodo ? addMeses(periodo, 12) : null;                // até quando as férias precisam ser concedidas
  let status;
  if (c.status !== 'Ativo') status = '–';
  else if (!limite) status = 'Não elegível';
  else if (hoje > limite) status = 'VENCIDO';
  else if (diasEntre(hoje, limite) <= (P.par.ferias_alerta_dias || 90)) status = 'ATENÇÃO';
  else status = 'OK';
  let alerta = 'OK';
  if (status === 'VENCIDO') alerta = 'Férias vencidas: programar imediatamente';
  else if (!c.ferias_prevista) alerta = status === 'Não elegível' ? 'Ainda sem direito (menos de 1 ano de casa)' : 'Sem data prevista';
  else if (limite && c.ferias_prevista > limite) alerta = 'Previsão depois do limite legal: antecipar';
  else {
    const mesmo = naoDesligados().filter(o => o.setor === c.setor && o.ferias_prevista && o.ferias_prevista.slice(0, 7) === c.ferias_prevista.slice(0, 7)).length;
    if (mesmo > (P.par.ferias_max_setor_mes || 2)) alerta = `Mais de ${P.par.ferias_max_setor_mes || 2} do setor no mesmo mês`;
  }
  return { meses, periodo, limite, status, alerta };
}
function vtDoMes(m = P.mes) {
  return naoDesligados().map(c => { const dias = P.vt.get(c.id + '|' + m); return { c, dias: dias ?? null, total: (dias || 0) * c.vt_dia }; });
}
function comissaoDoMes(m = P.mes) {
  const cm = P.comMes.get(m) || { total: 0, g: P.par.comissao_garcom, r: P.par.comissao_retaguarda, l: P.par.comissao_loja };
  const linhas = naoDesligados().map(c => {
    const faltas = P.faltas.get(c.id + '|' + m) || 0;
    const eleg = c.status === 'Ativo' && c.grupo_comissao !== 'Não participa' && faltas === 0;
    return { c, faltas, eleg };
  });
  const vg = (cm.total || 0) * cm.g, vr = (cm.total || 0) * cm.r, vl = (cm.total || 0) * cm.l;
  const ng = linhas.filter(l => l.eleg && l.c.grupo_comissao === 'Garçom').length, nr = linhas.filter(l => l.eleg && l.c.grupo_comissao === 'Retaguarda').length;
  for (const l of linhas) l.valor = !l.eleg ? 0 : l.c.grupo_comissao === 'Garçom' ? (ng ? vg / ng : 0) : (nr ? vr / nr : 0);
  return { cm, linhas, vg, vr, vl, ng, nr, soma: Math.round((cm.g + cm.r + cm.l) * 10000) / 10000 };
}
function valesDoMes(m = P.mes) {
  const doMes = P.vales.filter(v => v.data.slice(0, 7) === m);
  const lim = P.par.vale_limite_pct, max = P.par.vale_max_mes;
  const porColab = new Map();
  for (const v of doMes) if (v.status !== 'Negado') { const x = porColab.get(v.colaborador_id) || { total: 0, n: 0 }; x.total += v.valor; x.n++; porColab.set(v.colaborador_id, x); }
  const linhas = doMes.map(v => {
    const c = colab(v.colaborador_id), x = porColab.get(v.colaborador_id) || { total: 0, n: 0 };
    let sit = 'OK';
    if (v.status === 'Negado') sit = 'Negado';
    else if (!c || !(c.salario_base > 0)) sit = 'Sem salário cadastrado';
    else if (x.total > c.salario_base * lim + 0.004) sit = 'ACIMA DO LIMITE';
    else if (x.n > max) sit = 'Mais de um vale no mês';
    return { v, c, sit, foraPrazo: Number(v.data.slice(8, 10)) > P.par.vale_dia_solicitar };
  });
  const resumo = [...porColab].map(([id, x]) => {
    const c = colab(id); const p = c && c.salario_base ? x.total / c.salario_base : null;
    return { c, total: x.total, n: x.n, p, alerta: p === null ? 'Sem salário' : p > lim + 1e-9 ? 'Acima do limite' : p >= lim * 0.8 ? 'Perto do limite' : 'OK' };
  }).filter(r => r.c).sort((a, b) => b.total - a.total);
  const total = doMes.filter(v => v.status !== 'Negado').reduce((s, v) => s + v.valor, 0);
  const folha = P.colabs.filter(c => c.status === 'Ativo').reduce((s, c) => s + (c.salario_base || 0), 0);
  return { linhas, resumo, total, folha, pctFolha: folha ? total / folha : 0, acima: linhas.filter(l => l.sit === 'ACIMA DO LIMITE').length };
}

}

function ligarColaboradores() {

}
function formColab(c) {
  const novo = !c, ed = pode.pessoasEdita(), fe = c ? ferias(c) : null;
  const cargos = [...new Set(P.colabs.map(x => x.cargo).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  abrirGaveta(`<form class="form" id="fcol"><h3>${novo ? 'Novo colaborador' : esc(c.nome)}</h3>
    ${fe ? `<p class="sub">Tempo de casa: <b>${tempoCasa(fe.meses)}</b>${fe.limite ? ` · férias até <b>${dataBR(fe.limite)}</b> ${tagFerias(fe.status)}` : ''}</p>` : '<p class="sub">Preencha o que tiver; dá para completar depois.</p>'}
    ${campo('c_nome', 'Nome completo', { valor: c ? c.nome : '', attrs: 'required', desab: !ed })}
    <div class="linha2">${campo('c_uni', 'Unidade', { opcoes: [['', '–']].concat(unidadesP()), valor: c ? c.unidade || '' : (S.unidades[0] || ''), desab: !ed })}
    ${campo('c_set', 'Setor', { valor: c ? c.setor || '' : '', lista: setores(), desab: !ed })}</div>
    <div class="linha2">${campo('c_cargo', 'Cargo', { valor: c ? c.cargo || '' : '', lista: cargos, desab: !ed })}
    ${campo('c_nivel', 'Nível', { opcoes: [['', '–']].concat(NIVEIS_PADRAO.concat(c && c.nivel && !NIVEIS_PADRAO.includes(c.nivel) ? [c.nivel] : [])), valor: c ? c.nivel || '' : '', desab: !ed })}</div>
    <div class="linha2">${campo('c_adm', 'Admissão', { tipo: 'date', valor: c ? c.admissao || '' : '', desab: !ed })}
    ${campo('c_status', 'Status', { opcoes: STATUS_COLAB, valor: c ? c.status : 'Ativo', desab: !ed })}</div>
    <div id="c_deslbox">${campo('c_desl', 'Data do desligamento', { tipo: 'date', valor: c ? c.desligamento || '' : '', desab: !ed })}</div>
    ${campo('c_grupo', 'Grupo da comissão (10%)', { opcoes: GRUPOS, valor: c ? c.grupo_comissao : 'Retaguarda', desab: !ed, ajuda: 'Garçom: salão (rateio dos 5%). Retaguarda: cozinha, bar, produção, caixa (rateio dos 3%).' })}
    <div class="linha2">${campo('c_sal', 'Salário base (R$)', { valor: c && c.salario_base !== null ? fNum(2).format(c.salario_base) : '', attrs: 'inputmode="decimal"', desab: !ed })}
    ${campo('c_vt', 'Vale-transporte por dia (R$)', { valor: c ? fNum(2).format(c.vt_dia) : '', attrs: 'inputmode="decimal"', desab: !ed })}</div>
    ${campo('c_pix', 'Chave PIX', { valor: c ? c.chave_pix || '' : '', desab: !ed })}
    ${campo('c_fer', 'Férias previstas (início)', { tipo: 'date', valor: c ? c.ferias_prevista || '' : '', desab: !ed, ajuda: fe && fe.limite ? `Precisa começar até ${dataBR(fe.limite)}.` : '' })}
    ${campo('c_obs', 'Observações', { tipo: 'textarea', valor: c ? c.observacao || '' : '', desab: !ed })}
    ${ed ? `<div class="acoes"><button class="btn prim" id="bsalvacol" type="submit">${novo ? 'Cadastrar' : 'Salvar'}</button>${!novo ? '<button class="btn perigo" type="button" id="bremcol">Excluir cadastro</button>' : ''}</div>` : ''}
  </form>`, () => {
    const sync = () => { document.getElementById('c_deslbox').style.display = val('c_status') === 'Desligado' ? '' : 'none'; };
    document.getElementById('c_status').onchange = () => { sync(); if (val('c_status') === 'Desligado' && !val('c_desl')) document.getElementById('c_desl').value = hojeISO(); };
    sync();
    document.getElementById('fcol').onsubmit = async ev => {
      ev.preventDefault();
      const num = id => val(id).trim() ? lerNum(val(id)) : null;
      const d = { nome: val('c_nome').trim(), unidade: val('c_uni') || null, setor: val('c_set').trim() || null, cargo: val('c_cargo').trim() || null, nivel: val('c_nivel') || null,
        admissao: val('c_adm') || null, status: val('c_status'), desligamento: val('c_status') === 'Desligado' ? (val('c_desl') || hojeISO()) : null, grupo_comissao: val('c_grupo'),
        salario_base: num('c_sal'), vt_dia: num('c_vt') || 0, chave_pix: val('c_pix').trim() || null, ferias_prevista: val('c_fer') || null, observacao: val('c_obs').trim() || null };
      if ([d.salario_base, d.vt_dia].some(v => v !== null && (isNaN(v) || v < 0))) { toast('Confira salário e vale-transporte.'); return; }
      if (novo && P.colabs.some(x => norm(x.nome) === norm(d.nome))) { if (!confirm(`Já existe um colaborador chamado ${d.nome}. Cadastrar mesmo assim?`)) return; }
      await executar('bsalvacol', () => novo ? API.inserir('colaboradores', [Object.assign({ empresa_id: S.empresa.id }, d)]) : API.atualizar('colaboradores', { id: c.id }, d));
      fecharGaveta(); await gravarPessoas(async () => { }, novo ? `${esc(d.nome)} cadastrado(a).` : 'Cadastro atualizado.');
    };
    const br = document.getElementById('bremcol');
    if (br) br.onclick = async () => {
      if (!confirm(`Excluir o cadastro de ${c.nome}? Isso apaga também o VT, as faltas, os vales e a escala dessa pessoa. Para quem saiu da empresa, prefira mudar o status para "Desligado" e manter o histórico.`)) return;
      await executar(br, () => API.remover('colaboradores', { id: c.id }));
      fecharGaveta(); await gravarPessoas(async () => { }, 'Cadastro excluído.');
    };
  });
}

/* ---------------------------------------------------------- Férias */
function telaFerias() {
  const ordem = { VENCIDO: 0, 'ATENÇÃO': 1, OK: 2, 'Não elegível': 3, '–': 4 };
  const linhas = naoDesligados().map(c => ({ c, f: ferias(c) })).filter(x => !P.filtros.ferias.so || (P.filtros.ferias.so === 'alerta' ? x.f.alerta !== 'OK' : x.f.status === P.filtros.ferias.so))
    .sort((a, b) => ordem[a.f.status] - ordem[b.f.status] || (a.f.limite || '9').localeCompare(b.f.limite || '9'));
  const ed = pode.pessoasEdita();
  const porMes = new Map(); for (const c of naoDesligados()) if (c.ferias_prevista) { const k = c.ferias_prevista.slice(0, 7); if (!porMes.has(k)) porMes.set(k, []); porMes.get(k).push(c); }
  const meses = [...porMes.keys()].filter(k => k >= hojeISO().slice(0, 7)).sort().slice(0, 12);
  return `<div class="cabeca"><div><h1>Férias</h1><p>O limite legal é a data até a qual as férias do último período completo precisam começar. Regra da casa: no máximo ${P.par.ferias_max_setor_mes} pessoas do mesmo setor no mesmo mês; planejar 6 meses à frente.</p></div></div>
  <div class="filtros">${[['', 'Todos'], ['alerta', 'Com alerta'], ['VENCIDO', 'Vencidas'], ['ATENÇÃO', 'Atenção'], ['Não elegível', 'Menos de 1 ano']].map(([v, t]) => `<button class="chip" data-fso="${v}" aria-pressed="${P.filtros.ferias.so === v}">${t}</button>`).join('')}</div>
  <div class="tabela-wrap"><table><thead><tr><th>Colaborador</th><th>Unidade</th><th>Setor</th><th>Admissão</th><th>Limite legal</th><th>Status</th><th>Início previsto</th><th>Alerta</th></tr></thead><tbody>
  ${linhas.map(({ c, f }) => `<tr><td>${esc(c.nome)}${c.status !== 'Ativo' ? `<span class="sub">${esc(c.status)}</span>` : ''}</td><td>${esc(c.unidade || '')}</td><td>${esc(c.setor || '')}</td><td>${dataBR(c.admissao)}</td><td>${f.limite ? dataBR(f.limite) : '<span class="sub">–</span>'}</td><td>${tagFerias(f.status)}</td>
    <td>${ed ? `<input type="date" class="in-data" id="fp-${esc(c.id)}" data-fprev="${esc(c.id)}" value="${esc(c.ferias_prevista || '')}" aria-label="Férias previstas de ${esc(c.nome)}">` : dataBR(c.ferias_prevista)}</td><td>${tagAlerta(f.alerta)}</td></tr>`).join('') || '<tr><td colspan="8" class="vazio">Ninguém nesta lista.</td></tr>'}
  </tbody></table></div>
  ${meses.length ? `<h2>Próximos meses</h2><div class="tabela-wrap sem-max"><table class="mini"><thead><tr><th>Mês</th><th>Quem sai de férias</th></tr></thead><tbody>${meses.map(m => `<tr><td>${mesBR(m + '-01')}</td><td>${porMes.get(m).map(c => `${esc(c.nome)} <span class="sub" style="display:inline">(${esc(c.setor || 'sem setor')})</span>`).join(', ')}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
function ligarFerias() {
  document.querySelectorAll('[data-fso]').forEach(b => b.onclick = () => { P.filtros.ferias.so = b.dataset.fso; render(); });
  document.querySelectorAll('[data-fprev]').forEach(inp => inp.onchange = () => gravarPessoas(() => API.atualizar('colaboradores', { id: inp.dataset.fprev }, { ferias_prevista: inp.value || null })));
}

  <div class="kpis"><div class="kpi"><div class="v">${brl(tot)}</div><div class="r">total a pagar em ${mesBR(mesISO())}</div></div>
    <div class="kpi"><div class="v">${linhas.filter(l => l.total > 0).length}</div><div class="r">pessoas a receber</div></div>

  <div class="filtros">${ed ? `<label for="vtpad" class="nota">Preencher quem está sem dias com</label><input id="vtpad" class="in-num peq" inputmode="numeric" placeholder="ex.: 22"><button class="btn peq" id="bvtpad">Preencher</button>` : ''}
    <button class="btn peq" id="bvtcsv" style="margin-left:auto">Baixar planilha (CSV)</button></div>
  <div class="tabela-wrap"><table><thead><tr><th>Colaborador</th><th>Unidade</th><th>Setor</th><th>Status</th><th class="num">R$/dia</th><th class="num">Dias trabalhados</th><th class="num">Total a pagar</th><th>Chave PIX</th></tr></thead><tbody>
  ${linhas.map(l => `<tr><td>${esc(l.c.nome)}</td><td>${esc(l.c.unidade || '')}</td><td>${esc(l.c.setor || '')}</td><td>${esc(l.c.status)}${l.c.status !== 'Ativo' && l.dias ? '<span class="sub" style="color:var(--alerta)">confira os dias</span>' : ''}</td><td class="num">${brl(l.c.vt_dia)}</td>
    <td class="num">${ed ? `<input class="in-num peq" inputmode="decimal" id="vt-${esc(l.c.id)}" data-vt="${esc(l.c.id)}" value="${l.dias === null ? '' : numTxt(l.dias, 1)}" aria-label="Dias de ${esc(l.c.nome)}">` : numTxt(l.dias, 1)}</td>
    <td class="num">${brl(l.total)}</td><td>${esc(l.c.chave_pix || '')}${l.total > 0 && !l.c.chave_pix ? '<span class="sub" style="color:var(--erro)">sem chave PIX</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="vazio">Nenhum colaborador cadastrado.</td></tr>'}
  </tbody><tfoot><tr><td colspan="6">Total</td><td class="num">${brl(tot)}</td><td></td></tr></tfoot></table></div>`;
}
function ligarVT() {
  ligarMes();
  const mes = mesISO();
  ligarNumeros('[data-vt]', inp => {
    const v = inp.value.trim() === '' ? 0 : lerNum(inp.value);
    if (isNaN(v) || v < 0 || v > 31) { toast('Digite os dias (de 0 a 31).'); render(); return; }
    gravarPessoas(() => API.upsert('vt_lancamentos', [{ colaborador_id: inp.dataset.vt, mes, dias: v }], 'colaborador_id,mes'));
  });
  const bp = document.getElementById('bvtpad');
  if (bp) bp.onclick = () => {
    const v = lerNum(val('vtpad')); if (!(v >= 0 && v <= 31)) { toast('Digite os dias (de 0 a 31).'); return; }

    if (!alvo.length) { toast('Todos os ativos já têm dias lançados.'); return; }
    gravarPessoas(() => API.upsert('vt_lancamentos', alvo.map(l => ({ colaborador_id: l.c.id, mes, dias: v })), 'colaborador_id,mes'), `${alvo.length} pessoa(s) preenchida(s) com ${numTxt(v, 1)} dias.`);
  };
  document.getElementById('bvtcsv').onclick = () => baixarCSV(`vale-transporte-${P.mes}.csv`, [['Colaborador', 'Unidade', 'Setor', 'Status', 'R$/dia', 'Dias', 'Total', 'Chave PIX']].concat(vtDoMes().map(l => [l.c.nome, l.c.unidade, l.c.setor, l.c.status, l.c.vt_dia, l.dias || 0, Math.round(l.total * 100) / 100, l.c.chave_pix])));
}

    <td class="num">${ed && l.c.grupo_comissao !== 'Não participa' ? `<input class="in-num peq" inputmode="numeric" id="ft-${esc(l.c.id)}" data-falta="${esc(l.c.id)}" value="${l.faltas || ''}" placeholder="0" aria-label="Faltas de ${esc(l.c.nome)}">` : (l.faltas || '0')}</td>

  const r = valesDoMes(), ed = pode.pessoasEdita(), lim = P.par.vale_limite_pct;
  return `<div class="cabeca"><div><h1>Vales (adiantamento)</h1><p>Um vale = uma linha. Limite de ${pct(lim)} do salário no mês e até ${P.par.vale_max_mes} vale(s) por pessoa. Pedidos até o dia ${P.par.vale_dia_solicitar}, pagamento no dia ${P.par.vale_dia_pagamento}.</p></div>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">${seletorMes()}${ed ? '<button class="btn prim" id="bnovovale">Lançar vale</button>' : ''}</div></div>
  <div class="kpis"><div class="kpi"><div class="v">${brl(r.total)}</div><div class="r">total de vales no mês (sem os negados)</div></div>
    <div class="kpi"><div class="v">${r.resumo.length}</div><div class="r">pessoas com vale</div></div>
    <div class="kpi"><div class="v">${pct(r.pctFolha)}</div><div class="r">da folha dos ativos comprometida</div></div>
    <div class="kpi ${r.acima ? 'erro' : ''}"><div class="v">${r.acima}</div><div class="r">vales acima do limite</div></div></div>
  <h2>Lançamentos de ${mesBR(mesISO())}</h2>
  <div class="tabela-wrap sem-max"><table><thead><tr><th>Data</th><th>Colaborador</th><th class="num">Valor</th><th>Motivo</th><th>Aprovado por</th><th>Status</th><th class="num">Limite da pessoa</th><th>Situação</th>${ed ? '<th></th>' : ''}</tr></thead><tbody>
  ${r.linhas.map(({ v, c, sit, foraPrazo }) => `<tr><td>${dataBR(v.data)}${foraPrazo ? '<span class="sub" style="color:var(--alerta)">pedido fora do prazo</span>' : ''}</td><td>${esc(c ? c.nome : '(excluído)')}</td><td class="num">${brl(v.valor)}</td><td>${esc(v.motivo || '')}</td><td>${esc(v.aprovado_por || '')}</td>
    <td>${ed ? `<select class="in-sel" id="vs-${esc(v.id)}" data-vst="${esc(v.id)}" aria-label="Status do vale">${['Solicitado', 'Aprovado', 'Pago', 'Negado'].map(s => `<option ${s === v.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : esc(v.status)}</td>
    <td class="num">${c && c.salario_base ? brl(c.salario_base * lim) : '–'}</td><td>${tagAlerta(sit)}</td>
    ${ed ? `<td class="num"><button class="x" data-vrem="${esc(v.id)}" title="Excluir lançamento" aria-label="Excluir vale">×</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="9" class="vazio">Nenhum vale lançado em ${mesBR(mesISO())}.</td></tr>`}
  </tbody></table></div>
  <h2>Resumo por colaborador (desconto em folha)</h2>
  <div class="tabela-wrap sem-max"><table><thead><tr><th>Colaborador</th><th class="num">Salário base</th><th class="num">Vales</th><th class="num">Total em vales</th><th class="num">% do salário</th><th>Alerta</th></tr></thead><tbody>
  ${r.resumo.map(x => `<tr><td>${esc(x.c.nome)}</td><td class="num">${brl(x.c.salario_base)}</td><td class="num">${x.n}</td><td class="num">${brl(x.total)}</td><td class="num">${pct(x.p)}</td><td>${tagAlerta(x.alerta)}</td></tr>`).join('') || '<tr><td colspan="6" class="vazio">Sem vales no mês.</td></tr>'}
  </tbody></table></div>`;
}
function formVale() {
  const pessoas = naoDesligados();
  const dataPad = hojeISO().slice(0, 7) === P.mes ? hojeISO() : mesISO();
  abrirGaveta(`<form class="form" id="fvale"><h3>Lançar vale</h3><p class="sub">O sistema avisa se passar do limite de ${pct(P.par.vale_limite_pct)} do salário.</p>
    ${campo('v_col', 'Colaborador', { opcoes: [['', 'Escolha…']].concat(pessoas.map(c => [c.id, c.nome])), attrs: 'required' })}
    <div class="linha2">${campo('v_data', 'Data do pedido', { tipo: 'date', valor: dataPad, attrs: 'required' })}${campo('v_valor', 'Valor (R$)', { attrs: 'inputmode="decimal" required' })}</div>
    <div class="previa" id="v_prev">Escolha o colaborador para ver quanto ainda cabe no limite.</div>
    ${campo('v_motivo', 'Motivo', { valor: '' })}
    <div class="linha2">${campo('v_aprov', 'Aprovado por', { valor: S.membro.nome || '' })}${campo('v_status', 'Status', { opcoes: ['Solicitado', 'Aprovado', 'Pago', 'Negado'], valor: 'Solicitado' })}</div>
    <div class="acoes"><button class="btn prim" id="bsalvavale" type="submit">Lançar</button></div></form>`, () => {
    const prev = () => {
      const c = colab(val('v_col')), el = document.getElementById('v_prev'); if (!c) { el.innerHTML = 'Escolha o colaborador para ver quanto ainda cabe no limite.'; return; }
      const m = (val('v_data') || mesISO()).slice(0, 7);
      const ja = P.vales.filter(v => v.colaborador_id === c.id && v.data.slice(0, 7) === m && v.status !== 'Negado');
      const soma = ja.reduce((s, v) => s + v.valor, 0), lim = (c.salario_base || 0) * P.par.vale_limite_pct, novo = lerNum(val('v_valor')) || 0;
      el.innerHTML = !c.salario_base ? 'Este colaborador está sem salário cadastrado; não dá para conferir o limite.'
        : `Limite no mês: <b>${brl(lim)}</b> · já pedido: <b>${brl(soma)}</b> (${ja.length} vale${ja.length === 1 ? '' : 's'}) · cabe ainda: <b>${brl(Math.max(lim - soma, 0))}</b>${novo && soma + novo > lim + 0.004 ? '<br><b style="color:var(--erro)">Este valor passa do limite.</b>' : ''}${ja.length >= P.par.vale_max_mes ? `<br><b style="color:var(--alerta)">Já tem ${ja.length} vale(s) no mês (máximo ${P.par.vale_max_mes}).</b>` : ''}`;
    };
    ['v_col', 'v_data', 'v_valor'].forEach(id => document.getElementById(id).addEventListener('input', prev));
    document.getElementById('v_col').addEventListener('change', prev);
    document.getElementById('fvale').onsubmit = async ev => {
      ev.preventDefault();
      const d = { empresa_id: S.empresa.id, colaborador_id: val('v_col'), data: val('v_data'), valor: lerNum(val('v_valor')), motivo: val('v_motivo').trim() || null, aprovado_por: val('v_aprov').trim() || null, status: val('v_status') };
      if (!d.colaborador_id) { toast('Escolha o colaborador.'); return; }
      if (!(d.valor > 0)) { toast('Digite o valor do vale.'); return; }
      await executar('bsalvavale', () => API.inserir('vales', [d]));
      fecharGaveta(); P.mes = d.data.slice(0, 7);
      await gravarPessoas(async () => { }, 'Vale lançado.');
    };
  });
}
function ligarVales() {
  ligarMes();
  const b = document.getElementById('bnovovale'); if (b) b.onclick = formVale;
  document.querySelectorAll('[data-vst]').forEach(s => s.onchange = () => gravarPessoas(() => API.atualizar('vales', { id: s.dataset.vst }, { status: s.value })));
  document.querySelectorAll('[data-vrem]').forEach(x => x.onclick = () => { if (confirm('Excluir este lançamento de vale?')) gravarPessoas(() => API.remover('vales', { id: x.dataset.vrem }), 'Lançamento excluído.'); });
}

/* ---------------------------------------------------------- Escala */
function telaEscala() {
  const f = P.filtros.escala, ed = pode.pessoasEdita();
  const dias = [...Array(7)].map((_, i) => addDias(P.semana, i));
  const pessoas = naoDesligados().filter(c => (!f.setor || c.setor === f.setor) && (!f.unidade || c.unidade === f.unidade)).sort((a, b) => (a.setor || '').localeCompare(b.setor || '', 'pt-BR') || a.nome.localeCompare(b.nome, 'pt-BR'));
  const tipo = (c, d) => P.escala.get(c.id + '|' + d) || '';
  // folgas de domingo no mês da semana (rodízio mensal)
  const mesRef = dias[6].slice(0, 7);
  const domingos = []; for (let d = segundaDe(mesRef + '-01'); d <= fimMes(mesRef); d = addDias(d, 7)) { const dom = addDias(d, 6); if (dom.slice(0, 7) === mesRef) domingos.push(dom); }
  const trocas = P.trocas.filter(t => t.data >= dias[0] && t.data <= dias[6]);
  return `<div class="cabeca"><div><h1>Escala semanal</h1><p>Publicar toda quarta-feira para a semana seguinte. Clique na célula para marcar: em branco = trabalha, <b>Folga</b>, <b>Dobra</b>. Troca só com aval do líder do setor, registrada abaixo.</p></div></div>
  <div class="filtros"><button class="btn peq" id="semant" aria-label="Semana anterior">←</button>
    <div class="mes-sel"><label for="psem">Semana de</label><input type="date" id="psem" value="${esc(P.semana)}"></div>
    <button class="btn peq" id="semprox" aria-label="Próxima semana">→</button>
    <select id="eset" aria-label="Setor"><option value="">Todos os setores</option>${setores().map(s => `<option ${s === f.setor ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select id="euni" aria-label="Unidade"><option value="">Todas as unidades</option>${unidadesP().map(u => `<option ${u === f.unidade ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
    ${ed ? '<button class="btn peq" id="bcopiar" style="margin-left:auto">Copiar folgas da semana anterior</button>' : ''}</div>
  <div class="legenda"><span>Trabalha</span><span class="l-folga">Folga</span><span class="l-dobra">Dobra</span></div>
  <div class="tabela-wrap sem-max"><table class="escala"><thead><tr><th>Colaborador</th>${dias.map((d, i) => `<th class="dia">${DIAS_SEM[i]}<span class="sub">${d.slice(8, 10)}/${d.slice(5, 7)}</span></th>`).join('')}<th class="num" title="Folgas em domingos no mês">Domingos de folga em ${mesBR(mesRef + '-01')}</th></tr></thead><tbody>
  ${pessoas.map(c => `<tr><td>${esc(c.nome)}<span class="sub">${esc([c.setor, c.unidade].filter(Boolean).join(' · '))}</span></td>${dias.map(d => { const t = tipo(c, d); return `<td class="dia"><button class="cel ${t}" data-cel="${esc(c.id)}|${d}" ${ed ? '' : 'disabled'} aria-label="${esc(c.nome)} em ${dataBR(d)}: ${t || 'trabalha'}">${t === 'folga' ? 'Folga' : t === 'dobra' ? 'Dobra' : '·'}</button></td>`; }).join('')}
    <td class="num">${domingos.filter(d => tipo(c, d) === 'folga').length} de ${domingos.length}</td></tr>`).join('') || '<tr><td colspan="9" class="vazio">Ninguém neste setor/unidade.</td></tr>'}
  </tbody><tfoot>
    <tr><td>Trabalhando</td>${dias.map(d => `<td class="num" style="text-align:center">${pessoas.filter(c => tipo(c, d) !== 'folga' && c.status === 'Ativo').length}</td>`).join('')}<td></td></tr>
    <tr><td>De folga</td>${dias.map(d => `<td style="text-align:center">${pessoas.filter(c => tipo(c, d) === 'folga').length}</td>`).join('')}<td></td></tr>
    <tr><td>Dobras</td>${dias.map(d => `<td style="text-align:center">${pessoas.filter(c => tipo(c, d) === 'dobra').length}</td>`).join('')}<td></td></tr>
  </tfoot></table></div>
  ${pessoas.some(c => c.status !== 'Ativo') ? '<p class="nota">Quem está de férias ou afastado aparece na lista, mas não conta em "Trabalhando".</p>' : ''}
  <h2>Trocas aprovadas na semana</h2>
  <div class="tabela-wrap sem-max"><table><thead><tr><th>Data</th><th>Quem sai</th><th>Quem entra</th><th>Motivo</th><th>Aprovado por</th>${ed ? '<th></th>' : ''}</tr></thead><tbody>
  ${trocas.map(t => `<tr><td>${dataBR(t.data)}</td><td>${esc(t.quem_sai)}</td><td>${esc(t.quem_entra)}</td><td>${esc(t.motivo || '')}</td><td>${esc(t.aprovado_por || '')}</td>${ed ? `<td class="num"><button class="x" data-trem="${esc(t.id)}" aria-label="Excluir troca">×</button></td>` : ''}</tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhuma troca registrada nesta semana.</td></tr>'}
  </tbody></table></div>
  ${ed ? `<form class="add-ing add-troca" id="ftroca">
    <div class="campo"><label for="t_data">Data</label><input type="date" id="t_data" value="${esc(dias[0])}" min="${dias[0]}" max="${dias[6]}" required></div>
    <div class="campo"><label for="t_sai">Quem sai</label><select id="t_sai" required><option value="">–</option>${naoDesligados().map(c => `<option>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label for="t_entra">Quem entra</label><select id="t_entra" required><option value="">–</option>${naoDesligados().map(c => `<option>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label for="t_mot">Motivo</label><input id="t_mot"></div>
    <div class="campo"><label for="t_apr">Aprovado por</label><input id="t_apr" value="${esc(S.membro.nome || '')}"></div>
    <button class="btn prim" id="btroca" type="submit">Registrar troca</button></form>` : ''}`;
}
function ligarEscala() {
  const $ = id => document.getElementById(id), f = P.filtros.escala;
  $('psem').onchange = e => { if (e.target.value) { P.semana = segundaDe(e.target.value); render(); } };
  $('semant').onclick = () => { P.semana = addDias(P.semana, -7); render(); };
  $('semprox').onclick = () => { P.semana = addDias(P.semana, 7); render(); };
  $('eset').onchange = e => { f.setor = e.target.value; render(); };
  $('euni').onchange = e => { f.unidade = e.target.value; render(); };
  document.querySelectorAll('[data-cel]').forEach(b => b.onclick = () => {
    const [id, data] = b.dataset.cel.split('|'); const atual = P.escala.get(id + '|' + data) || '';
    const prox = atual === '' ? 'folga' : atual === 'folga' ? 'dobra' : '';
    // mostra a mudança na hora e grava em seguida
    if (prox) P.escala.set(id + '|' + data, prox); else P.escala.delete(id + '|' + data);
    render();
    gravarPessoas(() => prox ? API.upsert('escala_dias', [{ colaborador_id: id, data, tipo: prox }], 'colaborador_id,data') : API.remover('escala_dias', { colaborador_id: id, data }));
  });
  if ($('bcopiar')) $('bcopiar').onclick = () => {
    const pessoas = naoDesligados().filter(c => (!f.setor || c.setor === f.setor) && (!f.unidade || c.unidade === f.unidade));
    const linhas = [];
    for (const c of pessoas) for (let i = 0; i < 7; i++) { const t = P.escala.get(c.id + '|' + addDias(P.semana, i - 7)); if (t) linhas.push({ colaborador_id: c.id, data: addDias(P.semana, i), tipo: t }); }
    if (!linhas.length) { toast('A semana anterior não tem folgas nem dobras marcadas para estas pessoas.'); return; }
    if (!confirm(`Copiar ${linhas.length} marcação(ões) da semana anterior para esta semana? O que já estiver marcado nos mesmos dias é substituído.`)) return;
    gravarPessoas(() => API.upsert('escala_dias', linhas, 'colaborador_id,data'), 'Escala copiada da semana anterior.');
  };
  document.querySelectorAll('[data-trem]').forEach(x => x.onclick = () => { if (confirm('Excluir esta troca?')) gravarPessoas(() => API.remover('escala_trocas', { id: x.dataset.trem }), 'Troca excluída.'); });
  const ft = $('ftroca');
  if (ft) ft.onsubmit = ev => {
    ev.preventDefault();
    if (val('t_sai') === val('t_entra')) { toast('Quem sai e quem entra precisam ser pessoas diferentes.'); return; }
    gravarPessoas(() => API.inserir('escala_trocas', [{ empresa_id: S.empresa.id, data: val('t_data'), quem_sai: val('t_sai'), quem_entra: val('t_entra'), motivo: val('t_mot').trim() || null, aprovado_por: val('t_apr').trim() || null }]), 'Troca registrada.');
  };
}

/* ---------------------------------------------------------- Parâmetros */
function telaParametrosPessoas() {
  const ed = pode.pessoasEdita(), p = P.par;
  const campos = [
    ['vale_limite_pct', 'Limite de vales no mês', '%', 'Percentual do salário base.'],
    ['vale_max_mes', 'Vales por pessoa no mês', 'n', 'Acima disso aparece o aviso "Mais de um vale no mês".'],
    ['vale_dia_solicitar', 'Pedir vale até o dia', 'n', 'Pedidos depois deste dia aparecem como fora do prazo.'],
    ['vale_dia_pagamento', 'Pagamento dos vales no dia', 'n', ''],
    ['ferias_max_setor_mes', 'Máximo de pessoas do mesmo setor de férias no mês', 'n', ''],
    ['ferias_alerta_dias', 'Avisar férias vencendo com antecedência de (dias)', 'n', 'Status ATENÇÃO.'],
    ['comissao_garcom', 'Comissão: parcela padrão dos garçons', '%', 'Usada nos meses novos; dá para ajustar mês a mês na tela Comissão.'],
    ['comissao_retaguarda', 'Comissão: parcela padrão da retaguarda', '%', ''],
    ['comissao_loja', 'Comissão: parcela padrão da loja', '%', ''],
  ];
  return `<div class="cabeca"><div><h1>Parâmetros</h1><p>Regras da casa usadas nas telas de vales, férias e comissão.</p></div></div>
  <div class="grade2"><section class="painel">${campos.slice(0, 6).map(([k, l, t, h]) => campo('pp_' + k, l, { valor: t === '%' ? fNum(1).format(p[k] * 100) : String(p[k]), attrs: `data-ppar="${k}" data-tipo="${t}" inputmode="decimal"`, ajuda: h + (t === '%' ? ' (em %)' : ''), desab: !ed })).join('')}</section>
  <section class="painel">${campos.slice(6).map(([k, l, t, h]) => campo('pp_' + k, l, { valor: fNum(1).format(p[k] * 100), attrs: `data-ppar="${k}" data-tipo="${t}" inputmode="decimal"`, ajuda: h + ' (em %)', desab: !ed })).join('')}</section></div>`;
}
function ligarParametrosPessoas() {
  document.querySelectorAll('[data-ppar]').forEach(inp => inp.onchange = () => {
    let v = lerNum(inp.value); if (isNaN(v) || v < 0) { toast('Valor inválido.'); render(); return; }
    if (inp.dataset.tipo === '%') v = Math.round(v * 100) / 10000; else v = Math.round(v);
    const dados = { [inp.dataset.ppar]: v, updated_at: new Date().toISOString() };
    gravarPessoas(() => P.parExiste ? API.atualizar('pessoas_parametros', { empresa_id: S.empresa.id }, dados) : API.inserir('pessoas_parametros', [Object.assign({ empresa_id: S.empresa.id }, dados)]), 'Parâmetro atualizado.');
  });
}

Object.assign(MODULOS.pessoas.telas, {
  painel: { titulo: 'Painel', render: telaPainelPessoas, ligar: ligarMes },
  colaboradores: { titulo: 'Colaboradores', render: telaColaboradores, ligar: ligarColaboradores, contador: () => P.colabs.filter(c => c.status !== 'Desligado').length || '' },
  ferias: { titulo: 'Férias', render: telaFerias, ligar: ligarFerias, contador: () => P.colabs.filter(c => ['VENCIDO', 'ATENÇÃO'].includes(ferias(c).status)).length || '' },
  vt: { titulo: 'Vale-transporte', render: telaVT, ligar: ligarVT },
  comissao: { titulo: 'Comissão (10%)', render: telaComissao, ligar: ligarComissao },
  vales: { titulo: 'Vales', render: telaVales, ligar: ligarVales },
  escala: { titulo: 'Escala', render: telaEscala, ligar: ligarEscala },
  parametros: { titulo: 'Parâmetros', render: telaParametrosPessoas, ligar: ligarParametrosPessoas },
});

iniciar();
</script>
</body>
</html>
