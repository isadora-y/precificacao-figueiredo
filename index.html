<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificação · Figueiredo</title>
<link rel="icon" href="brand/logo-figueiredo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  /* verde da logo do Figueiredo */
  --logo:#4B5D47; --marca:#4B5D47; --marca-escura:#2E3A2B; --marca-clara:#E4E9E1; --marca-tinta:#3A4836;
  --fundo:#F2F4F0; --superficie:#FFFFFF; --linha:#D6DCD3; --linha-forte:#B5BFB1;
  --texto:#1C221A; --texto-2:#566052; --texto-3:#838C7F;
  --ok:#2E7A4C; --ok-fundo:#E1F0E6; --alerta:#A86A12; --alerta-fundo:#FBEBCF; --erro:#B42318; --erro-fundo:#FBE3E0;
  --neutro-fundo:#ECEEE9; --foco:#6E8A68;
  --y-teal:#0D9299; --y-navy:#07252D;
  --raio:6px;
  --mono:'IBM Plex Mono', ui-monospace, monospace; --sans:'IBM Plex Sans', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--marca)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.lateral{background:var(--logo);color:#EEF2EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.marca img{width:56px;height:56px;display:block;flex:none}
.marca .palavra{font:600 18px/1.1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.marca .sub{font-size:12px;color:#D3DCCF;margin-top:3px}
nav.menu{display:flex;flex-direction:column;padding:12px 10px;gap:2px}
nav.menu a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:var(--raio);color:#E6ECE3;text-decoration:none;font-weight:500}
nav.menu a:hover{background:rgba(255,255,255,.08)}
nav.menu a.ativo{background:rgba(255,255,255,.18);color:#fff}
nav.menu .cont{font-size:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px}
.lateral .rodape{margin-top:auto;padding:16px 20px;font-size:12px;color:#C9D3C5;border-top:1px solid rgba(255,255,255,.12)}
.lateral .rodape b{color:#7FD3D6;font-weight:600}
.modo{margin:12px 12px 0;padding:10px 12px;border-radius:var(--raio);background:rgba(255,255,255,.1);font-size:12px;color:#DCE4D8}
.modo strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
main{min-width:0;padding:28px 32px 48px}
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:600 22px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--marca-escura)}
.cabeca p{margin:4px 0 0;color:var(--texto-2);max-width:70ch}
h2{font:600 15px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.03em;margin:28px 0 10px;color:var(--marca-escura)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--superficie);padding:14px 16px}
.kpi .v{font:600 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.kpi .r{font-size:13px;color:var(--texto-2);margin-top:4px}
.kpi.alerta .v{color:var(--alerta)}
.kpi.erro .v{color:var(--erro)}

/* barra de filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros input[type=search],.filtros select{height:36px;border:1px solid var(--linha-forte);border-radius:var(--raio);background:var(--superficie);padding:0 10px;min-width:0}
.filtros input[type=search]{width:260px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--linha-forte);background:var(--superficie);cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:#fff}
.btn{height:36px;padding:0 14px;border-radius:var(--raio);border:1px solid var(--linha-forte);background:var(--superficie);cursor:pointer;font-weight:500}
.btn.prim{background:var(--marca);border-color:var(--marca);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.espaco{flex:1}

/* tabelas */
.tabela-wrap{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:1;background:#F7F8F3;text-align:left;font-weight:600;font-size:12.5px;color:var(--texto-2);padding:9px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
th.num{text-align:right}
td{padding:8px 8px;border-bottom:1px solid #ECEEE4;vertical-align:middle}
tr.grupo td{background:var(--marca-clara);font:600 12.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--marca-tinta);padding:7px 10px}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover td{background:#FAFBF6}
td .sub{display:block;font-size:12px;color:var(--texto-3)}
td:first-child{min-width:180px}
.vazio{padding:28px;text-align:center;color:var(--texto-2)}

/* status e cmv */
.status{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.st-ok{background:var(--ok-fundo);color:var(--ok)}
.st-acima{background:var(--alerta-fundo);color:var(--alerta)}
.st-sem{background:var(--neutro-fundo);color:var(--texto-2)}
.cmv{display:flex;align-items:center;gap:8px;min-width:120px}
.cmv .trilho{position:relative;flex:1;height:8px;background:#ECEEE4;border-radius:4px}
.cmv .barra{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.cmv .barra.acima{background:var(--alerta)}
.cmv .alvo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--marca-escura)}
.cmv .pct{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmv .pct.acima{color:var(--alerta)}

/* inputs nas tabelas */
.in-num{width:96px;height:32px;border:1px solid var(--linha-forte);border-radius:5px;padding:0 8px;text-align:right;background:#FFFEF5;font-variant-numeric:tabular-nums}
.in-num:focus{background:#fff}
.zero{color:var(--erro);font-weight:600}
tr.mudou td{background:#FFF8E6}

/* fichas */
.fichas{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.lista{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);max-height:calc(100vh - 190px);overflow:auto}
.lista button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #ECEEE4;background:none;padding:9px 12px;cursor:pointer}
.lista button:hover{background:#FAFBF6}
.lista button.ativo{background:var(--marca-clara)}
.lista .tipo{font-size:11.5px;color:var(--texto-3)}
.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}
.painel h3{font:600 18px/1.25 var(--sans);margin:0}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 14px;color:var(--texto-2);font-size:13.5px}
.meta b{color:var(--texto);font-variant-numeric:tabular-nums}
.totais{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.totais > div{border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px}
.totais .v{font:600 18px var(--sans);font-variant-numeric:tabular-nums}
.totais .r{font-size:12.5px;color:var(--texto-2)}
.modo-preparo{white-space:pre-line;color:var(--texto-2);font-size:14px;max-width:75ch}
.usada{display:flex;flex-wrap:wrap;gap:6px}
.usada a{font-size:13px;background:var(--neutro-fundo);padding:3px 9px;border-radius:12px;text-decoration:none;color:var(--texto)}
.link{background:none;border:0;padding:0;color:var(--marca);cursor:pointer;text-decoration:underline;font:inherit}

/* gaveta */
.gaveta-fundo{position:fixed;inset:0;background:rgba(29,32,19,.35);display:none;z-index:20}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--fundo);z-index:21;transform:translateX(100%);transition:transform .2s ease;overflow:auto;padding:22px}
.gaveta.aberta{transform:none}
.gaveta-fundo.aberta{display:block}
.fechar{float:right}

/* simulador e parâmetros */
.grade2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600;color:var(--texto-2)}
.campo input,.campo select{height:38px;border:1px solid var(--linha-forte);border-radius:var(--raio);padding:0 10px;background:var(--superficie)}
.campo small{color:var(--texto-3);font-size:12.5px}
.nota{font-size:13px;color:var(--texto-2);max-width:75ch}
.sobe{color:var(--erro)} .desce{color:var(--ok)}

/* pendências */
.pend-grupo{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:12px}
.pend-grupo summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between}
.pend{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid #ECEEE4;align-items:start}
.pend.feita{opacity:.55}
.pend .onde{font-weight:600}
.pend .det{color:var(--texto-2);font-size:14px}
.pend .imp{font-size:12.5px;color:var(--alerta);white-space:nowrap}

/* aviso */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--marca-escura);color:#fff;padding:12px 16px;border-radius:var(--raio);max-width:min(560px,92vw);font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* login (modo Supabase) */
.tela-login{min-height:100vh;display:grid;place-items:center;padding:24px}
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:26px;width:min(420px,100%)}

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:sticky;height:auto;z-index:10}
  .marca{padding:10px 16px}
  .marca img{width:40px;height:40px}
  nav.menu{flex-direction:row;overflow-x:auto;padding:6px 8px 10px}
  nav.menu a{white-space:nowrap}
  nav.menu .cont{display:none}
  .lateral .rodape,.modo{display:none}
  main{padding:18px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fichas,.grade2{grid-template-columns:1fr}
  .lista{max-height:260px}
  .filtros input[type=search]{width:100%}
  .tabela-wrap{max-height:none}
  .totais{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){ .gaveta,.toast{transition:none} }
</style>
</head>

34,1.0],[164,"sal de cura (laboratorio exato)","Temperos","kg",1.0,"kg",48.0,1.0],[165,"sal de parrilha KG","Temperos","kg",1.0,"kg",7.2,1.0],[166,"sal refinado 1KG","Temperos","kg",1.0,"kg",3.76,1.0],[167,"Pão baguete","Pães","un",1.0,"un",2.0,1.0],[168,"pão brioche bread maker CX 36 UNI","Pães","cx 36 un",36.0,"un",68.12,1.0],[169,"PAO DE FORMA 480G","Pães","pct",1.0,"pct",8.99,1.0],[170,"Pão frânces","Pães","kg",1.0,"kg",7.0,1.0]],"receitas":[["arroz-branco","Arroz branco","base","",13.0,"kg","Refogar o alho, cebola e sal no óleo de soja. Não deixe dourar o alho, antes disso adicione o arroz, mexa, adicione a água quente 2x a proporção do arroz. Tampe e aguarde ferver, abaixe o fogo e deixe cozinhar até chegar no ponto."],["banana-a-milanesa","Banana à milanesa","base","",1.0,"porção",""],["batata-frita-com-ketchup-guarnicao","Batata frita com ketchup (guarnição)","base","",4.0,"porção","Manter as fritas congeladas, entrar com elas na fritadeira com o óleo a 180 graus. Fritar por 2,30min ou quando estiverem levemente douradas."],["batata-frita-temperada","Batata frita temperada","base","",0.3,"kg","Fritar a porção de 250g de batata a 180 graus por 2min e 30segundos, temperar com o tempero da batata sem excesso, servir com molho de queijo em cima, costela desfiada, e 5 tomatinhos cereja."],["batata-palha","Batata palha","base","",11.0,"kg","Descascar as batatas, ralas com ralador fino. Fritar em panela com oleo quente a 180 graus. Escorrer bem"],["brigadeiro-meio-amargo","Brigadeiro meio amargo","base","",2.28,"kg","Aquecer o leite condensado, entrar com o creme de leite e chocolate ralado. Mexer sem parar até ficar na consistência de puxa."],["brownie-bolinho","Brownie (bolinho)","base","",14.0,"un","Grelhar o pão para aquecer e selar, grelhar a carne colocando sal dos dois lados. Quando virar adicionar o queijo e o bacon já frito. Maionese adicionar na coroa do pão. Servir o burger na tábua com a porção de fritas ao lado."],["chapinha-figueiredo-unidade","Chapinha Figueiredo (unidade)","base","",4.0,"un",""],["chimichurri","Chimichurri","base","",1.0,"kg","misturar todos ingredientes e bater até ficar homogêneo"],["chips-de-batata-doce","Chips de batata doce","base","",1.5,"kg","1. Fatie as batatas, lava-se duas vezes e deixe dentro da água.\n2. Escorrer bem a água antes de colocar no óleo que deve estar a 180 graus.\n3. Depois que estiver frita, adicione o sal na batata."],["consume-de-legumes","Consumê de legumes","base","",1.6,"L","Em uma panela colocar tudo paracozinhar por 50min. Coar e reservar o caldo."],["farofa-de-ovos","Farofa de ovos","base","",1.0,"porção","1. Aqueça a frigideira em fogo médio para não queimar a margarina, adicione a cebola e refogue, adicione os ovos e o sal, deixe em pedaços médios, acrescente a farinha, cheiro verde e misture.\n2. Sirva imediatamente"],["feijao-tropeiro","Feijão tropeiro","base","",4.1,"kg","1. Em uma panela frite o bacon com a manteiga, quando estiver quase frito, adicione a calabresa, quando estiver frita coloque o alho e deixe dourar, depois a cebola, em seguida a couve e o feijão, refogue um pouco e coloque a farinha, acerte o sal.\n\nObs: Cozinhar o feijão com sal fino na panela sem pressão."],["legumes-cozidos","Legumes cozidos","base","",0.5,"kg","1. Coloque a agua pra ferver, adicione os ingredientes e deixe ferver bem.\n2. Escorra os legumes e finalize com o azeite um fio de azeite.\n3. Embala em porções de 200g, coloque vácuo e congele."],["mix-de-queijos-especial","Mix de queijos especial","base","",1.0,"kg","Misturar os dois queijos e porcionar em um saquinho."],["molho-branco","Molho branco","base","",14.0,"kg","1. Coloque o leite para ferver com a folha de louro, depois que ferver retire a folha de louro.\n2. Em uma panela coloque a margarina, doure o alho em seguida, cebola e farinha de trigo, deixe cozinhar, acrescente o leite aos poucos, até finalizar o leite.\n3. Adicione o leite, noz moscada e sal."],["molho-de-tomate","Molho de tomate","base","",35.0,"kg","1. Lave os tomates, retire o \"olho\" coloque para cozinhar com as rodelas de cebola, salsão e água.\n2. Depois de cozido bata no liquidificador e separe.\n3. Em uma panela aqueça o azeite, doure o alho, adicione a cebola batida e coloque o tomate batido dentro.\n4. Acrescente o tomate pelati batido no liquidificador e deixe ferver com fogo baixo, quando levantar fervura tire a espuma por várias vezes. Entre com o restante dos ingredientes, deixe cozinhar até o ponto de molho"],["molho-madeira","Molho madeira","base","",1.0,"L","Caramelizar o açucar até derreter, adicionar todos os ingredientes. Misturar em fogo baixo até a goiabada derreter por completo (colocar em cubos). Deixar em fogo baixo por 15min."],["molho-pesto","Molho pesto","base","",0.6,"kg","Polvilhar o rub bovino (6 porçao de sal para 1 de pimenta do reino moída). Colocar as costelas no pit smoker e assar por 3h até ficarem vermelhas. Embrulhar no celofane, colocar em GN de inox e cobrir com aluminio. Manter o pit a 150 graus até a costela atingir 95 graus internos."],["molho-tartaro","Molho tártaro","base","",4.0,"kg","1. No liquidificador coloque os ovos, limão, mostarda, sal, alho e pimenta.\n2. Bata rapidamente, adicione 1 garrafa de óleo e aos poucos colocar o restante do óleo até chegar no ponto de maionese bem firme.\n3. Coloque o restante dos ineredientes e bata até o ponto de molho.\n4. Acrescente o restante do óleo para engrossar."],["pao-de-alho-preparo","Pão de alho (preparo)","base","",1.0,"porção","Misturar todos ingredientes até ficar homogêneo, passar no pão e embalar. Congelar. No momento de servir grelhar na churrasqueira ou usar salamandra."],["pure-de-batata","Purê de batata","base","",0.6,"kg","1. Com a batata ainde quente e sem casca, espremer até virar purê;\n2. Acrescentar todos ingredientes e deixar cozinhar em fogo baixo, sempre mexendo para não queimar."],["rub-suino","Rub suíno","base","",13.0,"kg","4 partes de sal\n1 parte de pimenta do reino\n2 partes de paprica defumada ou doce\n1 parte de alho em po\n1 parte de cebola em pó\n4 partes de açucar mascavo\nMIsturar todos ingredientes"],["salada-do-executivo","Salada do executivo","base","",1.0,"porção","Refogar o alho, cebola e sal no óleo de soja. Não deixe dourar o alho, antes disso adicione o arroz, mexa, adicione a água quente 2x a proporção do arroz. Tampe e aguarde ferver, abaixe o fogo e deixe cozinhar até chegar no ponto."],["arroz-a-piamontese","Arroz à piamontese","preparo","",1.2,"kg","1. Em uma frigideira coloque margarina, cebola, champignon, acrescente o vinho e deixe evaporar o álcool.\n2. Acrescente o molho branco, arroz e misture bem até esquentar. Finalize com a mussarela."],["arroz-arboreo-pre-cozido","Arroz arbóreo pré-cozido","preparo","",1.44,"kg","1. Em uma panela, aqueça o azeite, refogue bem o alho e a cebola, em seguida adicione o arroz, vinho e deixe evaporar o alcool. Adicione e consomé e o sal. Quando ferver abaixe o fogo até secar. Fique atento ao ponto ao dente, caso necessário adicione mais consumé aos poucos.\n2 Após cozido, coloque numa vasihla grande para estriar.\n3. Faça porções de 300 gramas"],["arroz-biro-biro-inteira","Arroz biro biro (inteira)","preparo","",1.0,"porção","1. Em uma frigideira coloque a bacon para fritar, depois de frito retire um pouco da gordura.\n2. Em outra frigideira frite os ovas e quebre em pedaços médios.\n3. Na frigideira do bacon acrescente o arroz, batata palha, farinha, cheiro verde e os ovos em pedaços.\n4. Misture bem e sirva na panelinha"],["arroz-biro-biro-meia","Arroz biro biro (meia)","preparo","",1.0,"porção","1. Em uma frigideira coloque a bacon para fritar, depois de frito retire um pouco da gordura.\n2. Em outra frigideira frite os ovas e quebre em pedaços médios.\n3. Na frigideira do bacon acrescente o arroz, batata palha, farinha, cheiro verde e os ovos em pedaços.\n4. Misture bem e sirva na panelinha"],["arroz-com-brocolis","Arroz com brócolis","preparo","",0.5,"kg","1. Em uma frigideira coloque a bacon para fritar, depois de frito retire um pouco da gordura.\n2. Em outra frigideira frite os ovas e quebre em pedaços médios.\n3. Na frigideira do bacon acrescente o arroz, batata palha, farinha, cheiro verde e os ovos em pedaços.\n4. Misture bem e sirva na panelinha"],["recheio-de-pastel-de-carne","Recheio de pastel de carne","preparo","",3.5,"kg","Misturar os dois queijos e porcionar em um saquinho."],["vinagrete","Vinagrete","preparo","",1.5,"kg","6 tomates maduros;\n1 cebola roxa;\n200ml de azeite;\n1 limão espremido;\n80ml de vinagre de maçã;\n1 pimentão amarelo;\n½ maço de cheiro verde picado;\n2 colheres de ketchup;\n1 colher de chimichurri.\nSal 1/2 colher\nPicar bem os ingredientes, em brunoise, misturar todos ingredientes."],["pastel-de-camarao","Pastel de Camarão","prato","Petiscos",1.0,"porção","Frite o pastel e coloque em uma travessa em pé\nAcompanha Ketchup\n8 unidades por porção"],["pastelzinho-de-carne","Pastelzinho de carne","prato","Petiscos",1.0,"porção","Frite o pastel e coloque em uma travessa em pé\nAcompanha Ketchup\n8 unidades por porção"],["pastelzinho-de-queijo","Pastelzinho de queijo","prato","Petiscos",1.0,"porção","Frite o pastel e coloque em uma travessa em pé\nAcompanha Ketchup\n8 unidades por porção"],["coxinha-figueiredo","Coxinha Figueiredo","prato","Petiscos",50.0,"porção","Temperar a carne com rub bovino e 4 folhas de salvia, refogar a cebola e alho com óleo, fritar a carne em pedaços até dourar, deglacear o fundo com vinho tinto, deixar evaporar o alcool, adicionar 400g tomate pelatti, água até metade da altura da carne e colocar na pressão por 60 minutos ou até desfiar. Resfriar e misturar com bechamel, catupiry e cheiro verde. Resfriar a massa em uma assadeira. Quando estiver fria fazer coxinhas de 30g, empanar passando na farinha de trigo, leite, rosca, leite e panko. Temperar as farinhas com sal e paprica doce. Pré fritar os bolinhos a 150 graus por 2min. Congelar. e porcionar após congelado"],["batata-especial","Batata Especial","prato","Petiscos",1.0,"porção","Frite as batatas a 180 graus até dourar, escorra bem, coloque sal e pimenta do reino, em seguida emprate no prato normal e finalize com os queijos e o bacon. Gratine."],["batata-frita","Batata Frita","prato","Petiscos",1.0,"porção",""],["batata-figueiredo","Batata Figueiredo","prato","Petiscos",1.0,"porção","Frite as batatas a 180 graus até dourar, escorra bem, aqueça na panela um pacote de costela desfiada, adicione um pouco de água. Após secar coloque sobre a batata já frita, adicione catupiry e gratine."],["camarao-alho-e-oleo","Camarão alho e oleo","prato","Petiscos",1.0,"porção","Modo de PREPARO: \nEm uma frigideira coloque o azeite e refogue o camarão, acrescente o alho, flambe com o conhaque, coloque sal e salsinha\n\nComo servir: \n1- Coloque em uma travessa já decorada com o alface; \n2- Finalize com a salsinha e limão"],["camarao-a-milanesa","Camarão a milanesa","prato","Petiscos",1.0,"porção","Modo de PREPARO: \nEm uma frigideira coloque o azeite e refogue o camarão, acrescente o alho, flambe com o conhaque, coloque sal e salsinha\n\nComo servir: \n1- Coloque em uma travessa já decorada com o alface; \n2- Finalize com a salsinha e limão"],["chapinha-figueiredo","CHAPINHA FIGUEIREDO","prato","Petiscos",1.0,"porção",""],["isca-de-peixe","Isca de peixe","prato","Petiscos",1.0,"porção","MODO DE PREPARO\n1. Tempere a tilápia com sal, alho e limão.\n2. Passe na farinha de trigo, depois na mistura de ovo com leite e empane na farinha panko.\n\nCOMO SERVIR:\n1. Frite até ficar dourada.\n2. Coloque em uma travessa com papel toalha.\n3. Acompanha limão e molho tártaro."],["frango-a-passarinho","Frango a passarinho","prato","Petiscos",1.0,"porção","Frite o frango até dourar:\nEm uma travessa coloque as folhas de alface, depois coloque o frango e decore com o tomate,\nJoque o alho frita em cima do frango;\nDisponha o limão ao lado."],["combinado","Combinado","prato","Petiscos",1.0,"porção","Fritar a panceta até dourar, fritar as iscas de frango e carne de sol, assar e gratinar o pão de alho. Servir na tábua"],["panceta-defumada","Panceta defumada","prato","Petiscos",1.0,"porção","Furar a pele da barriga, sal na pele, temperar a carne com o sal e sal de cura (5 porções de sal para 1 de sal de cura) de porco, enrolar a barriga sem sobrepor a pele, colocar no refrigerador por 12h. Assar sem embrulhar a 190 graus (sem vapor) até a temperatura interna de 85 graus.. Resfriar e porcionar em rodelas de 1 dedo de espessura. Amarrar as rodelas. Ao servir, fritar o torresmo refrigerado em óleo quente a 180 graus. Servir com limão siciliano e barbecue."],["carne-de-sol-angus","Carne de sol Angus","prato","Petiscos",1.0,"porção","Frite as batatas a 180 graus até dourar, escorra bem, aqueça na panela um pacote de costela desfiada, adicione um pouco de água. Após secar coloque sobre a batata já frita, adicione catupiry e gratine."],["file-ao-molho-de-queijo","Filé ao molho de queijo","prato","Petiscos",1.0,"porção","1. Tempere o file com sal, coloque para grelhar na chapa.\n2. Em uma frigideira coloque a margarina, cebola e o gorgonzola, acrescente vinho e deixe evaporar o álcool.\n3. Adicione o molho branco, deixe ferver.\n\nCOMO SERVIR:\n1. Em uma travessa coloque o filé já grelhado e cubra com o molho de gorgonzola\n2. Finalize com salsinha\n3. Acompanha pãozinho"],["file-ao-molho-madeira","Filé ao molho madeira","prato","Petiscos",1.0,"porção","1. Tempere o filet com sal, coloque para grelhar na chapa.\n2. Em uma frigideira coloque a margarina e o alho e deixe dourar, acrescente a cebola deixe evaporar a álcool, entre com o molho madeira e deixe ferver, depois acrescen sirva.\n\nCOMO SERVIR:\n1. Em uma travessa coloque o filé com o molho madeira.\n2. Finalize com salsinha.\n3. Acompanha pãozinho"],["terra-e-mar","TERRA E MAR","prato","Petiscos",1.0,"porção",""],["pao-de-alho-artesanal","Pão de alho artesanal","prato","Petiscos",1.0,"porção",""],["queijo-coalho","Queijo Coalho","prato","Petiscos",1.0,"porção","Temperar os aneis de lula com sal, limão e pimenta do reino, empanar na farinha de trigo, mistura de ovo e leite, e farinha panko. Fritar a 180 graus, servir com molho tártaro"],["brusqueta-de-camarao","Brusqueta de camarão","prato","Entradas",1.0,"porção","Bater todos os ingredientes no liquidificador até que fique homogêneo. Manter em geladeira por 3 dias."],["ceviche-de-tilapia","Ceviche de tilápia","prato","Entradas",1.0,"porção","Temperar o peixe, camarão e polvo em um bowl com limão, sal, pimenta do reino, deixar mariando por 10min. Picar a cebola roxa em finas fatias, juntamente com a pimenta dedo de moça. Servir no prato com os camarões por cima, decorar com salsa e colocar o chips de mandioca ao lado."],["salada-caesar","Salada Caesar","prato","Saladas",1.0,"porção","Modo de Preparo: Em um bowl coloque o alface, frango, parmesão e o molho, mistures bem\n\nComo Servir: Use o prato de salada (chapéu chinês), coloque as folhas de forma que o frango fique por cima. Finalize com o restante do parmesão, croutons e salsinha."],["salada-ligth","Salada Ligth","prato","Saladas",1.0,"porção","1. Em um bowl coloque o alface limpo e seco, acrescente a cenoura, palmito, tomate, azeitona, lombo e o molho, misture bem.\nCOMO SERVIR:\nUse o prato de salada (chapéu chinês), coloque as folhas por baixo, os ingredientes por cima.\n2. Decore com tomate e salsinha."],["salada-mar","Salada mar","prato","Saladas",1.0,"porção","1. Refogar a cebola e alho com azeite, entrar com os camarões até mudarem de cor e começarem a dourar. Reservar.\n2. Montar o alface no prato chapeu, molho caesar sobre as folhas, ralar o parmesão;\n3 Dispor os camarões por cima;"],["camarao-figueiredo-meia","Camarão Figueiredo meia","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira coloque o molho bránco, presunto e o arroz, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o camarão temperado com caldo de frutos do mar e sal, em seguida coloque o molho, deixe esquentar bem.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, por cima coloque o camarão, cubra com queijo e gratine bem.\nPalha\n2. Finalize com batata palha e salsinha"],["camarao-figueiredo-inteira","Camarão Figueiredo Inteira","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira coloque o molho bránco, presunto e o arroz, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o camarão temperado com caldo de frutos do mar e sal, em seguida coloque o molho, deixe esquentar bem.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, por cima coloque o camarão, cubra com queijo e gratine bem.\nPalha\n2. Finalize com batata palha e salsinha"],["camarao-delicia-meia","Camarão Delícia meia","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira refogue a cebola e os camarões, coloque o molho bránco, misture bem até ficar bem cremoso.\n3. Adicione a banana por cima e coloque o queijo.\n4. Grarine e finalize com salsa"],["camarao-delicia-inteira","Camarão Delícia inteira","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira refogue a cebola e os camarões, coloque o molho bránco, misture bem até ficar bem cremoso.\n3. Adicione a banana por cima e coloque o queijo.\n4. Grarine e finalize com salsa\n5. Acompanha arroz."],["camarao-poro-meia","CAMARÃO PORO MEIA","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira refogue com margarina a cebola e os camarões, coloque o molho bránco, misture bem até ficar bem cremoso, adicione a muçarela e deixe derreter.\n3. Coloque na travessa e queijo por cima\n4. Grarine e finalize com salsa.\n5. Acompanha arroz."],["camarao-poro-inte caldo de frutos do mar e sal, em seguida coloque o molho, deixe esquentar bem, adicione o manjericão ao final.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, por cima coloque o camarão, cubra com queijo e gratine bem.\nPalha\n2. Finalize com batata palha, e salsinha e manjericão"],["camarao-mediterraneo-inteira","Camarão mediterrâneo inteira","prato","Frutos do mar",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira coloque o molho bránco, presunto e o arroz, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o camarão temperado com caldo de frutos do mar e sal, em seguida coloque o molho, deixe esquentar bem, adicione o manjericão ao final.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, por cima coloque o camarão, cubra com queijo e gratine bem.\nPalha\n2. Finalize com batata palha, e salsinha e manjericão"],["moqueca-de-peixe-com-camarao-meia","Moqueca de peixe com camarão meia","prato","Frutos do mar",1.0,"porção","1. Tempere o peixe com sal, alho, limão, coloque para cozinhar na água com sal e caldo de frutos do mar.\n2 Em outra frigideira coloque o azeite de dendé e doure a alho, coloque os pimentões, cebola, refogue um pouco e acrescente o caldo onde foi cozido o peixe, acrescente o leite de coco, cheiro verde e roux (engrossante - farinha de trigo dissolvida em água) para engrossar.\n3. Na panela onde sai à moqueca de peixe coloque as radelas de tomate por baixo, em cima dos tomates coloque os pimentões, adicione o peixe e finalize com o molho da moqueca.\n4. Separe um pouco do molho para fazer o pirão.\n5. Em outra panela cozinhe os camarões\n\nModo de servir:\nFinalize colocando os camarões por cima\n1. Acompanha pirão e arroz branco\n2. Para o pirão coloca o caldo que está separado pra ferver e entra com a farinha de mandioca aos poucos até o ponto de pirão fino."],["moqueca-de-peixe-com-camarao-inteira","Moqueca de peixe com camarão inteira igideira coloque o molho bránco, e o macarrão já cozido, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o filé temperad, em seguida misture, reserve uns filé para finalizar, deixe esquentar bem, adicione o manjericão ao final.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, finalize com queijo parmesão manjericão e os filés que havia reservado."],["costelinha-suina","Costelinha suína","prato","Executivos",1.0,"porção","Aquecer a costelinha em banho maria, servir no prato colocando o barbecue sobre ela.\nMODO DE SERVIR:\n1. Use o prato raso grande.\n2. Coloque a costelinha, molho sobre, arroz e fritas ao lado."],["camarao-figueiredo","Camarão figueiredo","prato","Executivos",1.0,"porção","1. Tempere os camarões com caldo de frutos do mar e sal.\n2. Em uma frigideira coloque o molho bránco, presunto e o arroz, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o camarão temperado com caldo de frutos do mar e sal, em seguida coloque o molho, deixe esquentar bem.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, por cima coloque o camarão, cubra com queijo e gratine bem.\nPalha\n2. Finalize com batata palha e salsinha"],["picadinho-figueiredo","Picadinho Figueiredo","prato","Executivos",1.0,"porção","1. Tempere os filés com alho e sal.\n2. Em uma frigideira coloque o molho bránco, e o macarrão já cozido, misture bem até ficar bem cremoso.\n3. Em outra frigideira coloque a margarina e a cebola e refogue bem, acrescente o filé temperad, em seguida misture, reserve uns filé para finalizar, deixe esquentar bem, adicione o manjericão ao final.\n\nMODO DE SERVIR:\n1. Coloque o arroz na travessa, finalize com queijo parmesão manjericão e os filés que havia reservado."],["tilapia-com-legumes","Tilápia com legumes","prato","Executivos",1.0,"porção","Temperar a tilápia com sal, grelhar na panela\nMODO DE SERVIR:\n1. Use o prato raso grande.\n /* ---------------------------------------------------------- motor de cálculo
   Espelha as views v_receita_custos e v_cardapio do schema.sql.
   Local: é a fonte dos números. Supabase: só para simulação não gravada.  */
function precoFinal(v, final) {
  if (!(v > 0)) return 0;
  const d = 1 - final;
  return Math.round((Math.ceil(v + d - 1e-9) - d) * 100) / 100;
}
function precoLiquido(i) { return i.preco / i.qtd * i.fc; }
function calcular(st, sobre = {}) {
  const P = Object.assign({}, st.parametros, sobre.parametros || {});
  const precoIns = id => { const i = st.insumos.get(id); const p = (sobre.precos && sobre.precos[id] !== undefined) ? sobre.precos[id] : i.preco; return p / i.qtd * i.fc; };
  const itensPor = new Map();
  for (const it of st.itens) { if (!itensPor.has(it.receita_id)) itensPor.set(it.receita_id, []); itensPor.get(it.receita_id).push(it); }
  const memo = new Map(), usoIns = new Map();
  function custo(rid, pilha = []) {
    if (memo.has(rid)) return memo.get(rid);
    if (pilha.includes(rid)) return { total: 0, unit: 0, semPreco: 0, insumos: new Set() };
    const r = st.receitas.get(rid); let total = 0, semPreco = 0; const ins = new Set();
    for (const it of (itensPor.get(rid) || [])) {
      const q = (sobre.qtds && sobre.qtds[it.id] !== undefined) ? sobre.qtds[it.id] : it.qtd;
      if (it.insumo_id) {
        const p = precoIns(it.insumo_id); ins.add(it.insumo_id);
        if (!(p > 0)) semPreco++;
        if (q !== null && q !== undefined) total += q * p;
      } else {
        const sub = custo(it.sub_id, pilha.concat(rid));
        sub.insumos.forEach(x => ins.add(x)); semPreco += sub.semPreco;
        if (q !== null && q !== undefined) total += q * sub.unit;
      }
    }
    const res = { total, unit: total / (r.rend || 1), semPreco, insumos: ins };
    memo.set(rid, res); return res;
  }
  for (const rid of st.receitas.keys()) custo(rid);
  for (const [rid, c] of memo) { const r = st.receitas.get(rid); if (r.tipo === 'prato' || r.tipo === 'drink') c.insumos.forEach(i => usoIns.set(i, (usoIns.get(i) || 0) + 1)); }
  const card = new Map();
  for (const c of st.cardapio) {
    let cp = null, origem = 'sem custo';
    const r = c.receita_id ? st.receitas.get(c.receita_id) : null;
    const bebida = !!(c.insumo_id || (r && r.tipo === 'drink'));
    if (c.receita_id) { cp = memo.get(c.receita_id).unit * (r.tipo === 'drink' ? 1 + P.perda_bar : 1); origem = 'ficha'; }
    else if (c.insumo_id) { cp = precoIns(c.insumo_id) * (c.qtd_insumo || 1); origem = 'revenda'; }
    else if (c.custo_manual !== null && c.custo_manual !== undefined) { cp = c.custo_manual; origem = 'manual'; }
    const preco = (sobre.precosVenda && sobre.precosVenda[c.id] !== undefined) ? sobre.precosVenda[c.id] : c.preco;
    const ct = cp === null ? null : cp + (c.custo_embalagem || 0);
    const alvo = bebida ? P.cmv_alvo_bebidas : P.cmv_alvo;
    const cmv = (ct !== null && preco > 0) ? ct / preco : null;
    card.set(c.id, {
      custo_produto: cp, custo_total: ct, origem, preco, cmv,
      lucro: (ct !== null && preco > 0) ? preco - ct : null,
      preco_markup: ct === null ? null : precoFinal(ct * P.markup_padrao, P.final_preco),
      preco_cmv_alvo: ct === null ? null : precoFinal(ct / alvo, P.final_preco),
      preco_ideal_ifood: ct === null ? null : precoFinal(ct * P.markup_ifood, P.final_preco),
      preco_minimo_ifood: ct === null ? null : precoFinal(ct * P.markup_ifood * P.fator_preco_minimo, P.final_preco),
      alvo,
      status: ct === null ? 'sem custo' : (!(preco > 0) ? 'sem preço' : (cmv > alvo ? 'acima do alvo' : 'ok')),
      semPreco: c.receita_id ? memo.get(c.receita_id).semPreco : 0,
    });
  }
  return { receitas: memo, cardapio: card, uso: usoIns, P };
}

function carregarLocal() {
  const D = DADOS;
  S.parametros = Object.assign({}, D.parametros);
  for (const [codigo, nome, categoria, ucompra, qtd, ubase, preco, fc] of D.insumos)
    S.insumos.set('i' + codigo, { id: 'i' + codigo, codigo, nome, categoria, unidade_compra: ucompra, qtd, unidade_base: ubase, preco, fc });
  for (const [slug, nome, tipo, categoria, rend, unid, modo] of D.receitas)
    S.receitas.set('r:' + slug, { id: 'r:' + slug, slug, nome, tipo, categoria, rend, unid, modo });
  D.itens.forEach(([rs, ordem, cod, sub, qtd, obs], k) =>
    S.itens.push({ id: 'it' + k, receita_id: 'r:' + rs, ordem, insumo_id: cod ? 'i' + cod : null, sub_id: sub ? 'r:' + sub : null, qtd, obs }));
  D.cardapio.forEach(([categoria, nome, rs, canal, preco, manual, antigo], k) =>
    S.cardapio.push({ id: 'c' + k, categoria, nome, canal, receita_id: rs ? 'r:' + rs : null, insumo_id: null, qtd_insumo: null, custo_manual: manual, custo_embalagem: 0, preco, ordem: k, custo_antigo: antigo }));
  D.pendencias.forEach(([tipo, onde, detalhe, impacto], k) => S.pendencias.push({ id: 'p' + k, tipo, onde, detalhe, impacto, resolvida: false }));
  S.original = { precos: new Map([...S.insumos].map(([k, v]) => [k, v.preco])), qtds: new Map(S.itens.map(i => [i.id, i.qtd])), parametros: Object.assign({}, S.parametros) };
  // edições salvas neste navegador
  try {
    const g = JSON.parse(localStorage.getItem(CHAVE_LOCAL) || 'null');
    if (g) {
      for (const [id, p] of Object.entries(g.precos || {})) if (S.insumos.has(id)) S.insumos.get(id).preco = p;
      const porId = new Map(S.itens.map(i => [i.id, i]));
      for (const [id, q] of Object.entries(g.qtds || {})) if (porId.has(id)) porId.get(id).qtd = q;
      Object.assign(S.parametros, g.parametros || {});
      for (const id of g.resolvidas || []) { const p = S.pendencias.find(x => x.id === id); if (p) p.resolvida = true; }
    }
  } catch (e) { /* armazenamento indisponível: segue sem histórico */ }
  S.oficial = calcular(S);
}
function salvarLocal() {
  const precos = {}, qtds = {}, parametros = {};
  for (const [id, i] of S.insumos) if (i.preco !== S.original.precos.get(id)) precos[id] = i.preco;
  for (const it of S.itens) if (it.qtd !== S.original.qtds.get(it.id)) qtds[it.id] = it.qtd;
  for (const k of Object.keys(S.parametros)) if (S.parametros[k] !== S.original.parametros[k]) parametros[k] = S.parametros[k];
  try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify({ precos, qtds, parametros, resolvidas: S.pendencias.filter(p => p.resolvida).map(p => p.id) })); } catch (e) { }
}
function restaurarLocal() {
  try { localStorage.removeItem(CHAVE_LOCAL); } catch (e) { }
  S.insumos = new Map(); S.receitas = new Map(); S.itens = []; S.cardapio = []; S.pendencias = [];
  carregarLocal(); render(); toast('Dados originais restaurados.');
}

  await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  const { data: emps, error } = await sb.from('empresas').select('id,nome,slug,logo_url');
  if (error) throw error;
  const emp = (emps || []).find(e => e.slug === CFG.empresaSlug) || (emps || [])[0];
  if (!emp) return telaSemAcesso(session.user.email);

async function recarregarSupabase() {
  const E = empresaId;
  const [par, ins, rec, its, vrc, vcard, card, pend] = await Promise.all([
    sb.from('parametros').select('*').eq('empresa_id', E).single(),
    todos(() => sb.from('insumos').select('id,codigo,nome,categoria,unidade_compra,qtd_por_unidade_compra,unidade_base,preco_unidade_compra,fator_correcao').eq('empresa_id', E).order('codigo')),
    todos(() => sb.from('receitas').select('id,slug,nome,tipo,categoria,rendimento,unidade_rendimento,modo_preparo').eq('empresa_id', E).order('id')),
    // sem embed: receita_itens tem duas chaves para receitas (receita e sub-receita); o filtro por empresa é feito abaixo
    todos(() => sb.from('receita_itens').select('id,receita_id,ordem,insumo_id,sub_receita_id,quantidade,observacao').order('id')),
    todos(() => sb.from('v_receita_custos').select('receita_id,custo_total,custo_por_unidade,insumos_sem_preco').eq('empresa_id', E).order('receita_id')),
    todos(() => sb.from('v_cardapio').select('*').eq('empresa_id', E).order('ordem').order('id')),
    todos(() => sb.from('cardapio_itens').select('id,custo_manual,qtd_insumo').eq('empresa_id', E).order('id')),
    todos(() => sb.from('pendencias').select('*').eq('empresa_id', E).order('id')),
  ]);
  if (par.error) throw par.error;
  const n = v => v === null || v === undefined ? null : Number(v);
  S.parametros = {}; for (const k of ['markup_padrao', 'cmv_alvo', 'cmv_alvo_bebidas', 'markup_ifood', 'fator_preco_minimo', 'perda_bar', 'final_preco']) S.parametros[k] = n(par.data[k]);
  S.insumos = new Map(ins.map(i => [i.id, { id: i.id, codigo: i.codigo, nome: i.nome, categoria: i.categoria, unidade_compra: i.unidade_compra, qtd: n(i.qtd_por_unidade_compra), unidade_base: i.unidade_base, preco: n(i.preco_unidade_compra), fc: n(i.fator_correcao) }]));
  S.receitas = new Map(rec.map(r => [r.id, { id: r.id, slug: r.slug, nome: r.nome, tipo: r.tipo, categoria: r.categoria, rend: n(r.rendimento), unid: r.unidade_rendimento, modo: r.modo_preparo }]));
  S.itens = its.filter(i => S.receitas.has(i.receita_id)).map(i => ({ id: i.id, receita_id: i.receita_id, ordem: i.ordem, insumo_id: i.insumo_id, sub_id: i.sub_receita_id, qtd: n(i.quantidade), obs: i.observacao }));
  const extra = new Map(card.map(c => [c.id, c]));
  S.cardapio = vcard.map(c => ({ id: c.id, categoria: c.categoria, nome: c.nome, canal: c.canal, receita_id: c.receita_id, insumo_id: c.insumo_id, qtd_insumo: n(extra.get(c.id)?.qtd_insumo), custo_manual: n(extra.get(c.id)?.custo_manual), custo_embalagem: n(c.custo_embalagem) || 0, preco: n(c.preco_venda), ordem: c.ordem }));
  S.pendencias = pend.map(p => ({ id: p.id, tipo: p.tipo, onde: p.onde, detalhe: p.detalhe, impacto: p.impacto, resolvida: p.resolvida }));
  // números oficiais = views do banco; o motor local fica só para simulação
  const local = calcular(S);
  const rc = new Map(vrc.map(r => [r.receita_id, { total: n(r.custo_total), unit: n(r.custo_por_unidade), semPreco: n(r.insumos_sem_preco), insumos: local.receitas.get(r.receita_id)?.insumos || new Set() }]));
  const cm = new Map(vcard.map(c => [c.id, { custo_produto: n(c.custo_produto), custo_total: n(c.custo_total), origem: c.origem_custo, preco: n(c.preco_venda), cmv: n(c.cmv), lucro: n(c.lucro_bruto), preco_markup: n(c.preco_markup), preco_cmv_alvo: n(c.preco_cmv_alvo), preco_ideal_ifood: n(c.preco_ideal_ifood), preco_minimo_ifood: n(c.preco_minimo_ifood), alvo: c.eh_bebida ? S.parametros.cmv_alvo_bebidas : S.parametros.cmv_alvo, status: c.status, semPreco: n(c.insumos_sem_preco) || 0 }]));
  S.oficial = { receitas: rc, cardapio: cm, uso: local.uso, P: S.parametros };
  S.original = { precos: new Map([...S.insumos].map(([k, v]) => [k, v.preco])), qtds: new Map(S.itens.map(i => [i.id, i.qtd])), parametros: Object.assign({}, S.parametros) };
}
async function gravar(acao) { // executa a escrita e recarrega as views
  try {
    const { data, error } = await acao();
    if (error) throw error;
    if (Array.isArray(data) && data.length === 0) { toast('Seu perfil não tem permissão para alterar isso.'); return false; }
    await recarregarSupabase(); return true;
  } catch (e) { toast('Não foi possível salvar: ' + esc(e.message || e)); return false; }
}

/* ---------------------------------------------------------- ações (local ou banco) */
async function alterarPrecoInsumo(id, novo) {
  const ins = S.insumos.get(id); const antes = ins.preco; if (novo === antes) return;
  const sim = calcular(S, { precos: { [id]: novo } });
  const afetados = []; for (const c of S.cardapio) { const a = S.oficial.cardapio.get(c.id), b = sim.cardapio.get(c.id); if (a.custo_total !== null && b.custo_total !== null && Math.abs(b.custo_total - a.custo_total) > 0.004) afetados.push({ c, d: b.custo_total - a.custo_total }); }
  afetados.sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  if (MODO === 'supabase') {
    const ok = await gravar(() => sb.from('insumos').update({ preco_unidade_compra: novo, atualizado_em: new Date().toISOString().slice(0, 10) }).eq('id', id).select('id'));
    if (!ok) { render(); return; }
  } else { ins.preco = novo; S.oficial = calcular(S); salvarLocal(); }
  const maior = afetados[0];
  toast(`<b>${esc(ins.nome)}</b>: ${brl(antes)} → ${brl(novo)}. ${afetados.length ? `${afetados.length} ite${afetados.length > 1 ? 'ns' : 'm'} do cardápio mud${afetados.length > 1 ? 'aram' : 'ou'} de custo; maior efeito em ${esc(maior.c.nome)} (${maior.d > 0 ? '+' : '−'}${brl(Math.abs(maior.d))} por porção).` : 'Nenhum item do cardápio usa este insumo.'}`, 6500);
  render();
}
async function alterarQtd(itemId, nova) {
  const it = S.itens.find(i => i.id === itemId); if (!it || nova === it.qtd) return;
  if (MODO === 'supabase') { await gravar(() => sb.from('receita_itens').update({ quantidade: nova }).eq('id', itemId).select('id')); }
  else { it.qtd = nova; S.oficial = calcular(S); salvarLocal(); }
  render();
}
async function alterarParametro(k, v) {
  if (MODO === 'supabase') { await gravar(() => sb.from('parametros').update({ [k]: v, updated_at: new Date().toISOString() }).eq('empresa_id', empresaId).select('empresa_id')); }
  else { S.parametros[k] = v; S.oficial = calcular(S); salvarLocal(); }
  render(); toast('Parâmetro atualizado. O cardápio foi recalculado.');
}
async function marcarPendencia(id, feito) {
  const p = S.pendencias.find(x => x.id === id);
  if (MODO === 'supabase') { await gravar(() => sb.from('pendencias').update({ resolvida: feito }).eq('id', id).select('id')); }
  else { p.resolvida = feito; salvarLocal(); }
  render();
}

function statusTag(s) {
  const cls = s === 'ok' ? 'st-ok' : s === 'acima do alvo' ? 'st-acima' : 'st-sem';

}
function cmvBar(cmv, alvo) {
  if (cmv === null || cmv === undefined) return '<span class="sub">–</span>';

  return `<div class="cmv" title="CMV ${pct(cmv)} · alvo ${pct(alvo)}"><div class="trilho"><div class="barra ${acima ? 'acima' : ''}" style="width:${w}%"></div><div class="alvo" style="left:${a}%"></div></div><span class="pct ${acima ? 'acima' : ''}">${pct(cmv)}</span></div>`;
}

    const sub = it.sub_id ? `<button class="link" data-ficha="${esc(S.receitas.get(it.sub_id).slug)}">${esc(nomeIngrediente(it))}</button>` : esc(nomeIngrediente(it));
    html += `<tr class="${it.qtd !== S.original.qtds.get(it.id) ? 'mudou' : ''}"><td>${sub}${it.obs ? `<span class="sub">${esc(it.obs)}</span>` : ''}${it.insumo_id && !(p > 0) ? '<span class="sub" style="color:var(--erro)">insumo sem preço</span>' : ''}</td>
      <td class="num">${editavel ? `<input class="in-num" inputmode="decimal" data-qtd="${esc(it.id)}" value="${it.qtd === null ? '' : new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 6 }).format(it.qtd)}" aria-label="Quantidade de ${esc(nomeIngrediente(it))}"> ` : qtdTxt(it.qtd) + ' '}${esc(u)}<span class="sub">${amigavel(it.qtd, u)}</span></td>
      <td class="num">${brl(p)}<span class="sub">por ${esc(u)}</span></td><td class="num">${brl(custo)}</td></tr>`;
  }
  html += `</tbody></table></div>
  <div class="totais"><div><div class="v">${brl(c.total)}</div><div class="r">custo da receita</div></div>
  <div><div class="v">${brl(c.unit)}</div><div class="r">custo por ${esc(r.unid)}</div></div>
  <div><div class="v">${c.semPreco}</div><div class="r">insumos sem preço</div></div></div>`;
  if (usadaEm.length) html += `<h2>Usada em</h2><div class="usada">${usadaEm.map(u => `<a href="#/fichas/${encodeURIComponent(u.slug)}">${esc(u.nome)}</a>`).join('')}</div>`;
  if (r.modo) html += `<h2>Modo de preparo</h2><div class="modo-preparo">${esc(r.modo)}</div>`;
  return html;
}

function telaFichas(arg) {
  const f = S.filtros.fichas;
  const lista = [...S.receitas.values()].filter(r => r.tipo === f.tipo && (!f.busca || norm(r.nome).includes(norm(f.busca)))).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const sel = [...S.receitas.values()].find(r => r.slug === arg) || lista[0];
  const n = t => [...S.receitas.values()].filter(r => r.tipo === t).length;
  return `<div class="cabeca"><div><h1>Fichas técnicas</h1><p>Bases são feitas só com insumos (molhos, arroz branco, purê). Preparos usam alguma base. Pratos são os itens do cardápio. Altere uma quantidade para ver o custo mudar em tudo que usa a receita.</p></div></div>
  <div class="fichas"><div><div class="filtros">${[['prato', 'Pratos'], ['preparo', 'Preparos'], ['base', 'Bases']].map(([v, t]) => `<button class="chip" data-tipo="${v}" aria-pressed="${f.tipo === v}">${t} (${n(v)})</button>`).join('')}
    <input type="search" id="rbusca" placeholder="Buscar ficha" value="${esc(f.busca)}" aria-label="Buscar ficha" style="width:100%"></div>
    <div class="lista">${lista.map(r => `<button data-ficha="${esc(r.slug)}" class="${sel && r.id === sel.id ? 'ativo' : ''}"><span>${esc(r.nome)}${r.categoria ? `<span class="tipo"> · ${esc(r.categoria)}</span>` : ''}</span><span class="num">${brl(S.oficial.receitas.get(r.id).unit)}</span></button>`).join('') || '<div class="vazio">Nenhuma ficha encontrada.</div>'}</div></div>
    <div class="painel">${sel ? detalheFicha(sel) : '<div class="vazio">Escolha uma ficha na lista.</div>'}</div></div>`;
}

const SIM = { insumo: '', preco: '', modo: 'alvo', pct: 5 };
function telaSimulador() {
  const ins = [...S.insumos.values()].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  let res = '';
  const i = S.insumos.get(SIM.insumo); const novo = lerNum(SIM.preco);
  if (i && !isNaN(novo)) {
    const sim = calcular(S, { precos: { [i.id]: novo } });
    const linhas = S.cardapio.map(c => ({ c, a: S.oficial.cardapio.get(c.id), b: sim.cardapio.get(c.id) })).filter(x => x.a.custo_total !== null && Math.abs(x.b.custo_total - x.a.custo_total) > 0.004).sort((x, y) => (y.b.custo_total - y.a.custo_total) - (x.b.custo_total - x.a.custo_total));
    const viram = linhas.filter(x => x.a.status !== 'acima do alvo' && x.b.status === 'acima do alvo').length;
    res = linhas.length ? `<p class="nota">${linhas.length} itens mudam de custo${viram ? `; <b>${viram}</b> passam a ficar acima do CMV alvo` : ''}. Nada foi gravado.</p>
      <div class="tabela-wrap" style="max-height:420px"><table><thead><tr><th>Item</th><th class="num">Custo hoje</th><th class="num">Custo simulado</th><th class="num">CMV hoje</th><th class="num">CMV simulado</th></tr></thead><tbody>
      ${linhas.map(x => `<tr><td>${esc(x.c.nome)}<span class="sub">${esc(x.c.categoria)}</span></td><td class="num">${brl(x.a.custo_total)}</td><td class="num ${x.b.custo_total > x.a.custo_total ? 'sobe' : 'desce'}">${brl(x.b.custo_total)}</td><td class="num">${pct(x.a.cmv)}</td><td class="num">${pct(x.b.cmv)} ${x.b.status === 'acima do alvo' ? '⚠︎' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<p class="nota">Nenhum item do cardápio usa ${esc(i.nome)}.</p>`;
  }
  // reajuste
  const precosVenda = {}; const reaj = [];
  for (const c of S.cardapio) {
    const o = S.oficial.cardapio.get(c.id); if (!(o.preco > 0) || o.custo_total === null) continue;
    let novoP = o.preco;
    if (SIM.modo === 'alvo' && o.status === 'acima do alvo') novoP = o.preco_cmv_alvo;
    if (SIM.modo === 'pct') novoP = precoFinal(o.preco * (1 + (lerNum(SIM.pct) || 0) / 100), S.parametros.final_preco);
    if (Math.abs(novoP - o.preco) > 0.004) { precosVenda[c.id] = novoP; reaj.push({ c, o, novoP }); }
  }
  const simR = calcular(S, { precosVenda });
  const base = S.cardapio.filter(c => S.oficial.cardapio.get(c.id).preco > 0);
  const aumMedio = base.reduce((s, c) => s + ((precosVenda[c.id] ?? S.oficial.cardapio.get(c.id).preco) / S.oficial.cardapio.get(c.id).preco - 1), 0) / (base.length || 1);
  const acimaDepois = [...simR.cardapio.values()].filter(o => o.status === 'acima do alvo').length;
  return `<div class="cabeca"><div><h1>Simulador</h1><p>Veja o efeito de uma mudança antes de aplicar. Nada aqui altera os dados.</p></div></div>
  <div class="grade2">
    <section class="painel"><h3>E se um insumo mudar de preço?</h3><p class="nota">Escolha o insumo e digite o novo preço da unidade de compra.</p>
      <div class="campo"><label for="sins">Insumo</label><select id="sins"><option value="">Escolha…</option>${ins.map(x => `<option value="${esc(x.id)}" ${x.id === SIM.insumo ? 'selected' : ''}>${esc(x.nome)} (${brl(x.preco)} / ${esc(x.unidade_compra)})</option>`).join('')}</select></div>
      <div class="campo"><label for="spreco">Novo preço (R$)</label><input id="spreco" inputmode="decimal" value="${esc(SIM.preco)}" placeholder="${i ? fNum(2).format(i.preco) : '0,00'}"></div>
      ${res}</section>
    <section class="painel"><h3>Reajuste do cardápio</h3><p class="nota">O aumento médio é ponderado pela participação de cada item nas vendas. Sem dados de vendas carregados, mostramos a média simples.</p>
      <div class="filtros">${[['alvo', 'Levar ao CMV alvo os itens acima'], ['pct', 'Reajuste linear']].map(([v, t]) => `<button class="chip" data-sim="${v}" aria-pressed="${SIM.modo === v}">${t}</button>`).join('')}</div>
      ${SIM.modo === 'pct' ? `<div class="campo"><label for="spct">Reajuste (%)</label><input id="spct" inputmode="decimal" value="${esc(SIM.pct)}"><small>Preços arredondados para terminar em ,90.</small></div>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><div class="v">${reaj.length}</div><div class="r">itens com preço novo</div></div><div class="kpi"><div class="v">${pct(aumMedio)}</div><div class="r">aumento médio do cardápio</div></div><div class="kpi"><div class="v">${acimaDepois}</div><div class="r">acima do alvo depois</div></div></div>
      ${reaj.length ? `<div class="tabela-wrap" style="max-height:360px"><table><thead><tr><th>Item</th><th class="num">Preço hoje</th><th class="num">Preço novo</th><th class="num">Aumento</th><th class="num">CMV novo</th></tr></thead><tbody>${reaj.map(x => `<tr><td>${esc(x.c.nome)}<span class="sub">${esc(x.c.categoria)}</span></td><td class="num">${brl(x.o.preco)}</td><td class="num">${brl(x.novoP)}</td><td class="num">${pct(x.novoP / x.o.preco - 1)}</td><td class="num">${pct(simR.cardapio.get(x.c.id).cmv)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="nota">Nenhum item precisa de preço novo com essa regra.</p>'}
    </section></div>`;
}

function telaPendencias() {
  const grupos = new Map(); for (const p of S.pendencias) { if (!grupos.has(p.tipo)) grupos.set(p.tipo, []); grupos.get(p.tipo).push(p); }
  let html = `<div class="cabeca"><div><h1>Pendências</h1><p>Pontos que precisam ser confirmados para os custos ficarem completos. Marque cada um quando estiver resolvido.</p></div></div>`;
  for (const [tipo, ps] of grupos) {
    const abertas = ps.filter(p => !p.resolvida).length;
    html += `<details class="pend-grupo" ${abertas ? 'open' : ''}><summary><span>${esc(tipo)}</span><span class="sub">${abertas} de ${ps.length} em aberto</span></summary>
    ${ps.map(p => `<label class="pend ${p.resolvida ? 'feita' : ''}"><input type="checkbox" data-pend="${esc(p.id)}" ${p.resolvida ? 'checked' : ''}><div><div class="onde">${esc(p.onde)}</div><div class="det">${esc(p.detalhe)}</div></div><div class="imp">${esc(p.impacto || '')}</div></label>`).join('')}</details>`;
  }
  return html;
}

function telaParametros() {
  const P = S.parametros;
  const campos = [
    ['cmv_alvo', 'CMV alvo dos pratos', '%', 'Itens acima disso aparecem em âmbar no painel. Provisório: confirmar com os sócios.'],
    ['markup_padrao', 'Markup padrão', 'x', 'Preço = custo × markup. 3 = markup de 300%.'],
    ['markup_ifood', 'Markup do iFood (preço ideal)', 'x', 'Preço ideal no iFood = (custo + embalagem) × este valor.'],
    ['fator_preco_minimo', 'Preço mínimo no iFood', '%', 'Percentual do preço ideal abaixo do qual não vale vender.'],
    ['cmv_alvo_bebidas', 'CMV alvo de bebidas', '%', 'Para drinks e revenda, quando forem cadastrados.'],
    ['perda_bar', 'Perda de bar', '%', 'Somada ao custo dos drinks (derrame, evaporação, cortesia).'],
  ];
  return `<div class="cabeca"><div><h1>Parâmetros</h1><p>Metas usadas em todo o sistema. Mudou aqui, o cardápio inteiro se recalcula.</p></div></div>
  <div class="grade2"><section class="painel">${campos.map(([k, l, t, h]) => `<div class="campo"><label for="p_${k}">${l}</label><input id="p_${k}" data-par="${k}" data-tipo="${t}" inputmode="decimal" value="${t === '%' ? fNum(1).format(P[k] * 100) : fNum(2).format(P[k])}"><small>${h} ${t === '%' ? '(em %)' : '(multiplicador)'}</small></div>`).join('')}</section>
  <section class="painel"><h3>Sobre estes dados</h3><p class="nota">${S.insumos.size} insumos, ${S.receitas.size} receitas (${[...S.receitas.values()].filter(r => r.tipo === 'base').length} bases, ${[...S.receitas.values()].filter(r => r.tipo === 'preparo').length} preparos, ${[...S.receitas.values()].filter(r => r.tipo === 'prato').length} pratos) e ${S.cardapio.length} itens de cardápio nas unidades Valparaíso e Planaltina.</p>
  ${MODO === 'local' ? `<p class="nota">As alterações ficam guardadas neste navegador.</p><button class="btn" id="restaurar">Restaurar dados originais</button>` : ''}</section></div>`;
}

/* ---------------------------------------------------------- render + eventos */
function abrirGaveta(html) { const g = document.getElementById('gaveta'); g.innerHTML = `<button class="btn fechar" id="gfechar">Fechar</button>` + html; g.classList.add('aberta'); g.setAttribute('aria-hidden', 'false'); document.getElementById('gfundo').classList.add('aberta'); ligarGaveta(); document.getElementById('gfechar').focus(); }
function fecharGaveta() { const g = document.getElementById('gaveta'); g.classList.remove('aberta'); g.setAttribute('aria-hidden', 'true'); document.getElementById('gfundo').classList.remove('aberta'); }
let gavetaReceita = null;
function ligarGaveta() {
  const g = document.getElementById('gaveta');
  document.getElementById('gfechar').onclick = fecharGaveta;
  g.querySelectorAll('[data-ficha]').forEach(b => b.onclick = () => { fecharGaveta(); location.hash = '#/fichas/' + encodeURIComponent(b.dataset.ficha); });
  g.querySelectorAll('a[href^="#/fichas/"]').forEach(a => a.onclick = fecharGaveta);
  g.querySelectorAll('[data-qtd]').forEach(inp => inp.onchange = async () => { const v = lerNum(inp.value); if (isNaN(v) || v < 0) { toast('Quantidade inválida.'); return; } await alterarQtd(inp.dataset.qtd, v); if (gavetaReceita) abrirGaveta(detalheFicha(gavetaReceita)); });
}
document.getElementById('gfundo').onclick = fecharGaveta;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharGaveta(); });

function render() {
  const r = rota(); const foco = document.activeElement && document.activeElement.id; const sel = foco && document.activeElement.selectionStart;
  const scroll = document.querySelector('.tabela-wrap')?.scrollTop;
  document.getElementById('raiz').innerHTML = shell(ROTAS[r.nome].render(r.arg), r.nome);
  document.title = ROTAS[r.nome].titulo + ' · Figueiredo';
  if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) { } } }
  const tw = document.querySelector('.tabela-wrap'); if (tw && scroll) tw.scrollTop = scroll;
  ligar(r);
}
function ligar(r) {
  const $ = id => document.getElementById(id), all = s => document.querySelectorAll(s);
  if ($('sair')) $('sair').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  // painel
  if ($('fbusca')) $('fbusca').oninput = e => { S.filtros.painel.busca = e.target.value; render(); };
  if ($('fcat')) $('fcat').onchange = e => { S.filtros.painel.cat = e.target.value; render(); };
  all('[data-st]').forEach(b => b.onclick = () => { S.filtros.painel.status = b.dataset.st; render(); });
  if ($('limpar')) $('limpar').onclick = () => { S.filtros.painel = { busca: '', cat: '', status: '' }; render(); };
  all('tr[data-item]').forEach(tr => tr.onclick = () => { const c = S.cardapio.find(x => x.id === tr.dataset.item); if (c && c.receita_id) { gavetaReceita = S.receitas.get(c.receita_id); abrirGaveta(detalheFicha(gavetaReceita)); } });
  // insumos
  if ($('ibusca')) $('ibusca').oninput = e => { S.filtros.insumos.busca = e.target.value; render(); };
  if ($('icat')) $('icat').onchange = e => { S.filtros.insumos.cat = e.target.value; render(); };
  all('[data-so]').forEach(b => b.onclick = () => { S.filtros.insumos.so = b.dataset.so; render(); });
  all('[data-ins]').forEach(inp => { inp.onfocus = () => inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); }; inp.onchange = () => { const v = lerNum(inp.value); if (isNaN(v) || v < 0) { toast('Digite um preço válido, por exemplo 79,90.'); render(); return; } alterarPrecoInsumo(inp.dataset.ins, Math.round(v * 10000) / 10000); }; });
  all('[data-uso]').forEach(b => b.onclick = () => {
    const id = b.dataset.uso; const i = S.insumos.get(id);
    const pratos = [...S.oficial.receitas].filter(([rid, c]) => c.insumos.has(id) && S.receitas.get(rid).tipo === 'prato').map(([rid]) => S.receitas.get(rid));
    abrirGaveta(`<h3>${esc(i.nome)}</h3><p class="nota">Usado, direta ou indiretamente, em ${pratos.length} pratos.</p><div class="usada">${pratos.map(p => `<a href="#/fichas/${encodeURIComponent(p.slug)}">${esc(p.nome)}</a>`).join('')}</div>`);
  });
  // fichas
  all('[data-tipo]').forEach(b => b.onclick = () => { S.filtros.fichas.tipo = b.dataset.tipo; location.hash = '#/fichas'; render(); });
  if ($('rbusca')) $('rbusca').oninput = e => { S.filtros.fichas.busca = e.target.value; render(); };
  all('#principal [data-ficha]').forEach(b => b.onclick = () => { const rr = [...S.receitas.values()].find(x => x.slug === b.dataset.ficha); if (rr) S.filtros.fichas.tipo = rr.tipo; location.hash = '#/fichas/' + encodeURIComponent(b.dataset.ficha); });
  all('#principal [data-qtd]').forEach(inp => { inp.onfocus = () => inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); }; inp.onchange = () => { const v = lerNum(inp.value); if (isNaN(v) || v < 0) { toast('Quantidade inválida.'); render(); return; } alterarQtd(inp.dataset.qtd, v); }; });
  // simulador
  if ($('sins')) $('sins').onchange = e => { SIM.insumo = e.target.value; SIM.preco = ''; render(); };
  if ($('spreco')) $('spreco').oninput = e => { SIM.preco = e.target.value; clearTimeout(ligar._t); ligar._t = setTimeout(render, 250); };
  all('[data-sim]').forEach(b => b.onclick = () => { SIM.modo = b.dataset.sim; render(); });
  if ($('spct')) $('spct').oninput = e => { SIM.pct = e.target.value; clearTimeout(ligar._t); ligar._t = setTimeout(render, 250); };
  // pendências
  all('[data-pend]').forEach(c => c.onchange = () => marcarPendencia(isNaN(Number(c.dataset.pend)) ? c.dataset.pend : Number(c.dataset.pend), c.checked));
  // parâmetros
  all('[data-par]').forEach(inp => inp.onchange = () => { let v = lerNum(inp.value); if (isNaN(v) || v <= 0) { toast('Valor inválido.'); render(); return; } if (inp.dataset.tipo === '%') v = v / 100; alterarParametro(inp.dataset.par, Math.round(v * 10000) / 10000); });
  if ($('restaurar')) $('restaurar').onclick = restaurarLocal;
}
window.addEventListener('hashchange', () => { fecharGaveta(); render(); window.scrollTo(0, 0); });

(async function iniciar() {
  try {
    if (MODO === 'supabase') { await iniciarSupabase(); if (!S.oficial) return; }
    else carregarLocal();
    render();
  } catch (e) {
    console.error(e);
    document.getElementById('raiz').innerHTML = `<div class="tela-login"><div class="cartao"><h1>Não foi possível carregar</h1><p class="nota">${esc(e.message || e)}</p><p class="nota">Confira a URL e a chave pública do Supabase em <code>config.js</code> e se o schema e o seed foram aplicados.</p></div></div>`;
  }
})();
</script>
</body>
</html>
